<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Hub 会话</title>
<link rel="icon" href="/favicon.ico?v=0.5.1" sizes="any" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --dim: #9aa3b2; --accent: #4c8dff; --ok: #35c48a;
    --warn: #e8b339; --bad: #e2565b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.55 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  button { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--bad); color: #ffd6d7; }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--panel2);
           border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  textarea { width: 100%; resize: vertical; min-height: 64px; }
  code, .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
  .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px;
         background: var(--panel); border-bottom: 1px solid var(--line); }
  .top strong { margin-right: 6px; }
  .top .grow { flex: 1; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
          border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: var(--ok); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  .chip.info { color: var(--accent); border-color: var(--accent); }
  /* Three columns: conversations | timeline + composer | usage, summary, plan (P4.5). */
  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr) 340px; height: calc(100% - 53px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 12px; overflow: auto; }
  aside.side { border-right: 0; border-left: 1px solid var(--line); }
  .side details.sec { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .side details.sec > summary { cursor: pointer; padding: 6px 10px; font-weight: 600; font-size: 13px; }
  .side details.sec:has(> .usage-bar[hidden]) { display: none; }
  .side .usage-bar { margin: 0; border: 0; padding: 2px 10px 10px; }
  /* The section heading already names these two. */
  #summaryBar .usage-line > strong:first-child, #planBar > .usage-line:first-child > strong:first-child { display: none; }
  .side .plan-form .row, .side .summary-form .row { flex-wrap: wrap; }
  .drawer-btn, .drawer-close { display: none; }
  aside li .t { display: flex; gap: 6px; align-items: center; }
  aside li .t span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside ul { list-style: none; margin: 10px 0 0; padding: 0; }
  aside li { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  aside li:hover { background: var(--panel2); }
  aside li.active { background: var(--panel2); outline: 1px solid var(--accent); }
  aside li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside li .d { color: var(--dim); font-size: 12px; }
  aside details.archived { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  aside details.archived > summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #timeline { flex: 1; overflow: auto; padding: 16px; }
  .empty { color: var(--dim); text-align: center; margin-top: 15vh; }
  .msg { max-width: 860px; margin: 0 auto 14px; }
  .bubble { padding: 10px 12px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: #22324f; border: 1px solid #2d4370; }
  .assistant .bubble { background: var(--panel); border: 1px solid var(--line); }
  .provisional .bubble { background: transparent; border: 1px dashed var(--line); color: #cfd6e2; }
  .who { color: var(--dim); font-size: 12px; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .call { margin-top: 8px; padding: 10px 12px; border-radius: var(--radius); background: var(--panel);
          border: 1px solid var(--line); }
  .call .row, .card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .call .note, .card .note { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
  .card { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--warn);
          background: #2a2414; }
  .card.done { border-color: var(--line); background: var(--panel2); }
  .card h4 { margin: 0 0 6px; font-size: 13.5px; }
  .card dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0; }
  .card dt { color: var(--dim); }
  .card dd { margin: 0; word-break: break-all; }
  .card dd.mono { white-space: pre-wrap; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  #composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  #composer .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  #composer .grow { flex: 1; }
  .dim { color: var(--dim); font-size: 12.5px; }
  .banner { margin: 10px 16px 0; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--warn); color: var(--warn); }
  .consent { display: block; margin-top: 8px; padding: 8px 10px; border: 1px dashed var(--warn); border-radius: 8px;
             color: #f3dca0; font-size: 12.5px; cursor: pointer; }
  button.mini { padding: 1px 8px; font-size: 12px; margin-left: 6px; }
  button.mini.on { border-color: var(--accent); color: var(--accent); }
  details.sent { margin-top: 8px; font-size: 12.5px; }
  details.sent pre { white-space: pre-wrap; max-height: 260px; overflow: auto; margin: 6px 0 0;
                     padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
  .usage-bar { margin: 10px 16px 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
               font-size: 12.5px; color: var(--dim); }
  .usage-bar strong { color: var(--fg); font-weight: 600; }
  .usage-panel { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px;
                 color: var(--dim); }
  .usage-panel h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--fg); }
  .model-usage-group { margin:12px 0; }
  .model-usage-row { border-left:2px solid var(--line); padding:5px 8px; margin:5px 0; }
  .agent-subtotal { padding-top:5px; border-top:1px solid var(--line); }
  .model-budget-form .row { gap:4px; margin:4px 0; }
  .usage-line { margin: 2px 0; word-break: break-word; }
  .summary-form, .plan-form { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .summary-field { display: flex; flex-direction: column; gap: 2px; }
  .summary-field textarea { min-height: 40px; }
  #toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px; border-radius: 8px;
           background: #3a1f22; border: 1px solid var(--bad); color: #ffd6d7; display: none; white-space: pre-wrap; }
  /* Narrower windows: the conversation list folds first (it is needed less while
     working), the side panel stays; below 900px it folds too. Folded columns are
     drawers, so the timeline always keeps the full height. */
  @media (max-width: 1279px) {
    .layout { grid-template-columns: minmax(0, 1fr) 300px; }
    aside.left { position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 88vw); z-index: 30;
                 transform: translateX(-100%); transition: transform .15s; box-shadow: 8px 0 24px #0008; }
    aside.left.open { transform: none; }
    #convToggle, .left .drawer-close { display: inline-block; }
  }
  @media (max-width: 899px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    aside.side { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); z-index: 30;
                 transform: translateX(100%); transition: transform .15s; box-shadow: -8px 0 24px #0008; }
    aside.side.open { transform: none; }
    #panelToggle, .side .drawer-close { display: inline-block; }
  }
</style>

<body>
<header class="top">
  <button id="convToggle" class="drawer-btn" type="button">会话</button>
  <img src="/assets/app-icon.png" alt="" width="28" height="28" style="border-radius:6px" />
  <strong>Agent Hub · 会话</strong>
  <span id="adapterChip" class="chip">适配器未知</span>
  <span id="connChip" class="chip">未连接</span>
  <span id="autoChip" class="chip" hidden></span>
  <span id="autoCtl" hidden></span>
  <span class="grow"></span>
  <select data-theme-picker aria-label="界面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
  <button id="panelToggle" class="drawer-btn" type="button">面板</button>
  <input id="token" type="password" autocomplete="off" placeholder="用户 token（默认 dev-user-token）" />
  <button id="connectBtn">连接</button>
  <a href="/papers">论文研究</a>
  <a id="settingsLink" href="/settings" hidden>本机设置</a>
  <button id="desktopExit" hidden>退出 Hub</button>
</header>
<div class="layout">
  <aside class="left" id="leftPanel">
    <button class="drawer-close mini" type="button" data-close="leftPanel">关闭</button>
    <button id="newConvBtn" class="primary" style="width:100%">+ 新会话</button>
    <ul id="convList"></ul>
    <details id="archivedConvs" class="archived" hidden><summary id="archivedSummary">已归档</summary><ul id="archivedList"></ul></details>
    <div id="usageAll" class="usage-panel" hidden></div>
  </aside>
  <main>
    <div id="banner" class="banner" hidden></div>
    <div id="timeline"><div class="empty">选择或新建一个会话。发送消息只会生成待审批调用，不会直接调用 Agent。</div></div>
    <form id="composer" autocomplete="off">
      <textarea id="text" placeholder="输入消息（Ctrl+Enter 发送）"></textarea>
      <div class="row">
        <input id="fileRef" list="fileList" aria-label="引用文件" style="flex:1;min-width:200px"
               placeholder="引用文件：路径，或 路径:L10-20（带空格的路径可加引号）" />
        <datalist id="fileList"></datalist>
        <button type="button" id="addRefBtn">添加引用</button>
        <span id="refChips"></span>
      </div>
      <div class="row" id="suggestions"></div>
      <div id="sendPreview"></div>
      <div class="row">
        <label>Agent <select id="agent"></select></label>
        <label>模型 <input id="modelPicker" list="modelOptions" placeholder="接入方默认 / 输入模型 ID" aria-label="模型" style="width:190px" /><datalist id="modelOptions"></datalist></label>
        <label>推理强度 <select id="modelEffort" aria-label="推理强度"><option value="">默认强度</option></select></label>
        <button type="button" class="mini" id="refreshModelsBtn" title="启动本地元数据进程读取模型目录，不发送模型回合">刷新模型</button>
        <span id="modelHint" class="dim">默认模型未确认</span>

        <label title="每次创建调用都要明确选择；不会沿用上一次的选择">执行模式
          <select id="mode" aria-label="执行模式">
            <option value="" selected>请选择</option>
            <option value="strict">严格模式</option>
            <option value="supervised">用户监督模式</option>
          </select>
        </label>
        <label title="仅限 Claude 严格文件工具模式；还需开启右侧协作并设置数量限制。每次启动仍单独审批。">原生子 Agent
          <select id="nativeAgents"><option value="disabled">关闭</option><option value="approved">逐次审批</option></select>
        </label>
        <label title="作为可见的说明加在消息前，随审批绑定；是软目标，不会截断回复">输出
          <select id="outputStyle" aria-label="输出偏好">
            <option value="" selected>默认</option>
            <option value="concise">简洁</option>
            <option value="detailed">详细</option>
          </select>
        </label>
        <label title="把上一轮 Agent 回复所在的 provider thread 绑定进本次审批，续接其上下文">
          <input type="checkbox" id="resume" aria-label="续接上一轮（原生 thread）" /> 续接上一轮（原生 thread）
        </label>
        <span id="handoffChips"></span>
        <span class="grow dim" id="composerNote"></span>
        <button type="submit" id="sendBtn" class="primary">发送（生成待审批调用）</button>
      </div>
    </form>
  </main>
  <aside class="side" id="sidePanel">
    <button class="drawer-close mini" type="button" data-close="sidePanel">关闭</button>
    <details class="sec" data-key="auto" open><summary>自动执行</summary>
      <div id="autoBar" class="usage-bar" hidden></div></details>
    <details class="sec" data-key="usage" open><summary>用量与预算</summary>
      <div id="usageConv" class="usage-bar" hidden></div></details>
    <details class="sec" data-key="summary" open><summary>阶段摘要</summary>
      <div id="summaryBar" class="usage-bar" hidden></div></details>
    <details class="sec" data-key="plan" open><summary>协作计划</summary>
      <div id="planBar" class="usage-bar" hidden></div></details>
    <div id="sideEmpty" class="dim">选择一个会话后，这里显示它的用量与预算、阶段摘要和协作计划。</div>
  </aside>
</div>
<div id="toast" role="alert"></div>
<script>
"use strict";
/* Agent Hub conversation page.
 *
 * Authoritative state comes from two server reads: the message list
 * (/messages, cursor after_id) and the ordered event stream (/events/stream,
 * SSE read with fetch because EventSource cannot send Authorization). Events
 * are applied once each, by seq; on reconnect the page resumes from the last
 * seq it applied (Last-Event-ID), so nothing is lost or shown twice.
 *
 * One conversation is shown at a time, and every select() opens a new view
 * generation (S.viewGen). Each async result - messages, cards, stream frames,
 * a resync - carries the generation it was started under and is dropped when
 * the view has moved on, so an old conversation can never write into the
 * current one. A plain reconnect keeps the state; a resync (409) rebuilds it
 * completely by replaying the stream from seq 0.
 *
 * Manual calls are approved individually. Automatic calls require one explicit
 * stage authorization, enforced by the backend. All text uses textContent.
 */

const S = {
  token: "", adapter: null, cid: null, convs: [],
  lastSeq: 0, lastMsgId: 0, messages: [],
  calls: new Map(),   // invocation_id -> call model
  rawReplies: new Set(),
  cards: new Map(),   // tool_approval_id -> card view
  consent: new Map(), // invocation_id -> boundary consent ticked for THIS call only
  handoff: [],        // reply message_ids chosen to pass on with the NEXT call only
  refs: [],           // file references (agenthub.files syntax) for the NEXT call only
  sendPreview: null,  // what the composer would send now: {sent_text, context_preview, budget}
  foldOpen: {},       // "inv:<id>:ctx" -> true/false, remembered across re-renders
  renderedCid: null,  // conversation the last render belonged to (detects a switch)
  jumpPending: false, // jump to the newest message ONCE after opening a conversation
  suggestions: [],    // file references the user may add (never added without a click)
  summaries: [], summaryLink: {}, summaryInstruction: "",  // stage summaries (T-2)
  attachSummary: null, // summary_id sent with each next call until removed
  includeHistory: false, // the next call carries recent history (summary drafting)
  summaryEdit: null,   // the summary form being edited, or null
  plans: null,         // collaboration plans of this conversation (P4), with the switch state
  planEdit: null,      // the plan form being edited, or null
  stage: null, stageEdit: null,
  busy: new Set(),    // actions in flight (keys), to disable double clicks
  viewGen: 0, streamCtrl: null, msgTimer: null, renderQueued: false, banner: "",
  createPromise: null, // the one conversation creation in flight, shared by every caller
  stats: { reconnects: 0, resyncs: 0, created: 0 }, // diagnostics (exposed as data-* on <main>)
  pointerDown: false,
  timelineSignature: null, timelineDirty: false,
};

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const enc = encodeURIComponent;

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k === "disabled") node.disabled = true;
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

function toast(message) {
  const t = $("toast");
  t.textContent = message;
  t.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.style.display = "none"; }, 6000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制");
  } catch (_) { toast("复制未成功，请选中文字后按 Ctrl+C"); }
}

function timelineSelected() {
  const selection = window.getSelection();
  return !!(selection && !selection.isCollapsed && selection.rangeCount &&
            selection.getRangeAt(0).intersectsNode($("timeline")));
}

/* ---------------------------------------------------------------- API --- */

function describeError(status, data) {
  const d = data && data.detail;
  if (d && typeof d === "object") return `${status} ${d.code || ""} ${d.message || d.error || ""}`.trim();
  if (typeof d === "string") return `${status} ${d}`;
  return `HTTP ${status}`;
}

async function api(method, path, body, params) {
  const url = params ? `${path}?${new URLSearchParams(params)}` : path;
  const headers = { "Authorization": "Bearer " + S.token };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let data = null;
  try { data = await r.json(); } catch (_) { /* empty body */ }
  if (!r.ok) {
    const err = new Error(describeError(r.status, data));
    err.status = r.status; err.data = data;
    throw err;
  }
  return data;
}

/* -------------------------------------------------------------- model --- */

function call(id) {
  let c = S.calls.get(id);
  if (!c) {
    c = { id, status: null, approval_id: null, approval_status: null, agent_id: null,
          execution_mode: "strict", context_mode: "independent", resume_thread_id: null,
          handoff: [], sent_text: null, context_preview: null,
          stream: "", gap: false, turn: null, ended: null, declined: [], cards: [], stop: null,
          interrupt: null, native: [], usage: null };
    S.calls.set(id, c);
  }
  return c;
}

/* Is this async result still for the conversation on screen? */
function current(gen) { return gen === S.viewGen; }

function patch(target, fields) {
  for (const [k, v] of Object.entries(fields)) if (v !== undefined && v !== null) target[k] = v;
}

function absorbMessage(m) {
  if (S.messages.some((x) => x.message_id === m.message_id)) return;
  S.messages.push(m);
  S.lastMsgId = Math.max(S.lastMsgId, m.message_id);
  const inv = m.invocation;
  if (inv) {
    patch(call(inv.invocation_id), {
      status: inv.status, error: inv.error, approval_id: inv.approval_id, approval_status: inv.approval_status,
      agent_id: inv.agent_id, execution_mode: inv.execution_mode, model:inv.model, reasoning_effort:inv.reasoning_effort,
      native_subagents: inv.native_subagents,
      context_mode: inv.context_mode, resume_thread_id: inv.resume_thread_id,
      handoff: inv.handoff, sent_text: inv.sent_text, usage: inv.usage, budget: inv.budget,
      context_preview: inv.context_preview, plan_item: inv.plan_item, authorized_by: inv.authorized_by,
      workspace: inv.workspace, workspace_access: inv.workspace_access, execution_timeout_seconds: inv.execution_timeout_seconds,
    });
  }
}

/* Ledger views (normalized; unknown is never 0): this conversation's calls and
   root task, and this user's whole instance over the last 7 UTC days. */
async function loadUsage(gen = S.viewGen) {
  if (!S.token || !current(gen)) return;
  const since = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
  const all = await api("GET", "/api/usage/summary", undefined, { since });
  if (!current(gen)) return;
  S.usageAll = all;
  if (S.cid) {
    const cid = S.cid;
    const page = await api("GET", `/api/conversations/${enc(cid)}/usage`);
    if (!current(gen) || cid !== S.cid) return;
    for (const u of page.calls || []) call(u.invocation_id).usage = u;
    S.usageConv = page;
  }
  render();
}

function needUsage(gen = S.viewGen) {
  clearTimeout(S.usageTimer);
  S.usageTimer = setTimeout(() => {
    loadUsage(gen).catch((e) => { if (current(gen)) toast("读取用量失败：" + e.message); });
    loadPlans(gen).catch(() => { /* plans refresh with the next settlement */ });
    loadStage(gen).catch(() => { /* the stage refreshes with the next poll */ });
  }, 120);
}

/* ------------------------------------------- automatic stages (P4.6) --- */

const STAGE_LABEL = { active: ["自动执行中", "info"], repairing: ["自行修复中", "warn"],
  waiting_quota: ["等待额度恢复", "warn"], paused: ["已暂停", "warn"], completed: ["阶段已完成", "ok"],
  blocked: ["遇到阻塞", "bad"], stopped: ["已停止", ""] };
const STAGE_OPEN = ["active", "repairing", "waiting_quota", "paused"];
const PHASE_LABEL = { plan: "请主 Agent 拆分", work: "执行", review: "审阅", repair: "按审阅意见修复", collect: "汇总", done: "收尾" };
const PLAN_MODE_LABEL = { none: "不拆分（主 Agent 单次完成）", current: "用会话里最新的计划", agent: "请主 Agent 拆分" };
const REASON_LABEL = { step_failed: "步骤失败", no_result: "步骤结束但没有可交接的回复", status_unknown: "调用状态未知",

const EVENT_LABEL = { started: "开始", auto_approved: "按规则批准调用", tool_approved: "按规则允许工具",

async function loadStage(gen = S.viewGen) {
  if (!S.cid || !current(gen)) return;
  const cid = S.cid;
  const data = await api("GET", `/api/conversations/${enc(cid)}/stage`);
  if (!current(gen) || cid !== S.cid) return;
  S.stage = data;
  render();
}

function stageNow() { return S.stage && S.stage.stage; }
function stageOpen() { const s = stageNow(); return !!s && STAGE_OPEN.includes(s.status); }

async function stageAction(action) {
  const s = stageNow();
  if (!s) return;
  if (action === "stop" && !confirm("停止本阶段？未启动调用会被撤销，并向运行中的调用请求中断；远端停止以适配器确认为准。停止后不会自动恢复。")) return;
  await guarded("stage", async () => {
    await api("POST", `/api/stages/${enc(s.stage_id)}/${action}`);
    await loadStage();
    needMessages();
  });
}

function editStage() {
  const agents = (S.stage && S.stage.agents) || [];
  S.stageEdit = { goal: "", criteria: "", mode: "", consent: false, plan: "none", agents: agents.slice(),
                  main: $("agent").value, review: "", collect: "", maxCalls: "0", prefixes: "", files: false,
                  retries: "3", autoResume: true, quotaMinutes: "5" };
  render();
}

async function startStage() {
  const e = S.stageEdit;
  if (!e.goal.trim()) { toast("请填写阶段目标"); return; }
  if (!e.mode) { toast("请选择执行边界（严格或用户监督）"); return; }
  if (e.mode === "supervised" && !e.consent) { toast("用户监督模式需要先勾选边界同意"); return; }
  if (!e.agents.includes(e.main)) { toast("请从已勾选的 Agent 中重新选择主 Agent"); return; }
  if (!Number.isFinite(Number(e.quotaMinutes)) || Number(e.quotaMinutes) < 1 || Number(e.quotaMinutes) > 60) {
    toast("额度恢复复查间隔须为 1～60 分钟；Codex 执行时限请到本机设置调整，填 0 可不限时。"); return;
  }
  if ((e.review && !e.agents.includes(e.review)) || (e.collect && !e.agents.includes(e.collect))) {
    toast("请从已勾选的 Agent 中重新选择审阅和汇总 Agent"); return;
  }
  const body = { models:Object.fromEntries(e.agents.map(a => [a, e.models[a] || {}])), goal: e.goal.trim(), criteria: e.criteria.trim(), execution_mode: e.mode,
                 supervised_consent: e.consent === true, plan: e.plan, agents: e.agents, main_agent: e.main,
                 review_agent: e.review || null, collect_agent: e.collect || null, max_calls: Number(e.maxCalls),
                 command_prefixes: e.prefixes.split("\n").map((x) => x.trim()).filter(Boolean),
                 allow_file_changes: e.files === true, retry_limit: Number(e.retries), auto_resume: e.autoResume,
                 quota_retry_seconds: Number(e.quotaMinutes) * 60 };
  // Shown once, in full: this is the stage's whole authorization.
  const lines = ["按规则自动执行本阶段？以下内容一次授权，执行中不再逐张确认：",
    `各 Agent 模型：${JSON.stringify(body.models)}`,
    `目标：${body.goal}`, `完成标准：${body.criteria || "（未写）"}`,
    `执行边界：${body.execution_mode === "supervised" ? "用户监督模式" : "严格模式"}`,
    `Agent：${body.agents.join("、")}；主：${body.main_agent}；审阅：${body.review_agent || "不审阅"}` +
      (body.plan !== "none" ? `；汇总：${body.collect_agent || body.main_agent}` : ""),
    `计划：${PLAN_MODE_LABEL[body.plan]}`, `本阶段调用上限：${body.max_calls || '不限'}`,
    `自动允许的命令前缀：${body.command_prefixes.join("、") || "（无：所有工具请求都会被自动拒绝）"}`,
    `文件修改请求：${body.allow_file_changes ? "自动允许" : "自动拒绝"}`,
    `失败后最多修复重试 ${body.retry_limit} 次；额度恢复后${body.auto_resume ? "自动" : "手动"}继续。等待不消耗修复次数，所有调用仍计入总上限和预算。`,
    `恢复时间未知时，从 ${e.quotaMinutes} 分钟后检查，仍限额则间隔翻倍，最长 60 分钟；同一接入方共用等待。`,
    body.plan !== "none" ? "需要子任务：会开启协作扩展（生成新策略版本，作废未消费的手动审批）" : "",
    "删除、推送、合并、部署、联网下载等操作只有前缀里写明才会被允许。可随时暂停或停止。"].filter(Boolean);
  if (!confirm(lines.join("\n"))) return;
  await guarded("stage", async () => {
    await api("POST", `/api/conversations/${enc(S.cid)}/stages`, body);
    S.stageEdit = null;
    await loadStage();
    needUsage();
    needMessages();
  });
}
