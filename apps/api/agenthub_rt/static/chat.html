function lastNativeThread(agent) {
  for (let i = S.messages.length - 1; i >= 0; i--) {
    const m = S.messages[i];
    if (m.role !== "assistant" || !m.invocation || m.invocation.agent_id !== agent) continue;
    return (m.result && m.result.native_session && m.result.native_session.thread_id) || null;
  }
  return null;
}

function renderComposer() {
  const nativeAllowed = $("agent").value === "claude-code" && $("mode").value === "strict";
  $("nativeAgents").disabled = !nativeAllowed;
  if (!nativeAllowed) $("nativeAgents").value = "disabled";
  const agent = $("agent").value;
  const thread = lastNativeThread(agent);
  const active = [...S.calls.values()].some((c) => ["starting", "running", "unknown"].includes(c.status));
  const resume = $("resume");
  resume.disabled = !thread || active;
  if (resume.disabled) resume.checked = false;
  const mode = $("mode").value;
  // Chosen handoff replies that are still on screen (a stale id is dropped).
  S.handoff = S.handoff.filter((id) => S.messages.some((m) => m.message_id === id && m.role === "assistant"));
  const picks = S.handoff.map((id) => S.messages.find((m) => m.message_id === id));
  $("handoffChips").replaceChildren(...picks.map((m) => el("span", { class: "chip info" },
    `附带交接：${(m.invocation && m.invocation.agent_id) || "Agent"} #${m.message_id}（${m.text.length} 字）`,
    el("button", { class: "mini", title: "移除", onclick: () => toggleHandoff(m) }, "×"))));
  const attached = S.summaries.find((s) => s.summary_id === S.attachSummary);
  $("refChips").replaceChildren(
    ...(S.attachSummary != null ? [el("span", { class: "chip info" }, `附带摘要 v${attached ? attached.version : "?"}`,
      el("button", { type: "button", class: "mini", title: "移除",
                     onclick: () => { S.attachSummary = null; render(); previewSend(); } }, "×"))] : []),
    ...(S.includeHistory ? [el("span", { class: "chip warn" }, "附带最近历史（摘要草稿）",
      el("button", { type: "button", class: "mini", title: "移除",
                     onclick: () => { S.includeHistory = false; render(); previewSend(); } }, "×"))] : []),
    ...S.refs.map((spec) => el("span", { class: "chip info" },
    `引用：${spec}`, el("button", { type: "button", class: "mini", title: "移除", onclick: () => removeRef(spec) }, "×"))));
  renderSendPreview();
  $("composerNote").textContent = !S.token ? "请先连接"
    : !mode ? "请先选择执行模式"
    : active ? "有调用正在执行或状态未知，暂不能续接 thread"
    : thread ? `可续接 thread ${short(thread)}` : "";
  $("sendBtn").disabled = S.busy.has("send") || !S.token || !mode;
  $("newConvBtn").disabled = !!S.createPromise || !S.token;
}

/* Admission labels for the agent selected now (behind a router each agent differs). */
function renderAgentPosture() {
  loadModels();
  const a = agentInfo($("agent").value);
  const adm = a.execution_admission || {};
  const supervised = a.supervised_admission || {};
  const chipEl = $("adapterChip");
  const posture = adm.mode === "simulation" ? "离线模拟" : adm.allowed ? "严格模式可用"
    : supervised.allowed ? "用户监督可用 · 严格受限" : "当前不可启动";
  chipEl.textContent = `${a.name || "?"}${a.transport ? " · " + a.transport : ""} · ${posture}`;
  chipEl.className = "chip " + (adm.mode === "simulation" ? "info" : adm.allowed || supervised.allowed ? "warn" : "bad");
  chipEl.title = [adm.reason, supervised.reason].filter(Boolean).join("\n");
  // Mode options say what the adapter admits; the server decides regardless.
  const label = (x) => !x ? "" : x.mode === "simulation" ? "（离线模拟）"
    : x.allowed ? "" : "（当前适配器不放行）";
  const options = $("mode").options;
  options[1].textContent = "严格模式" + label(a.execution_admission);
  options[2].textContent = "用户监督模式" + label(a.supervised_admission);
  options[1].title = (a.execution_admission || {}).reason || "";
  options[2].title = (a.supervised_admission || {}).reason || "";
}

async function connect() {
  S.token = S.desktop ? "desktop-session" : ($("token").value.trim() || S.developmentToken || "dev-user-token");
  try { sessionStorage.setItem("agenthub.token", S.token); } catch (_) { /* storage blocked */ }
  try {
    S.adapter = await api("GET", "/api/adapter");
    renderAdapter();
    await loadConvs();
    setConn("", "已连接");
    const wanted = location.hash.slice(1);
    if (wanted && S.convs.some((c) => c.conversation_id === wanted)) await select(wanted);
  } catch (e) {
    setConn("error", "连接失败");
    toast(e.message);
  }
  render();
}

});
document.addEventListener("pointerdown", () => { S.pointerDown = true; }, true);
document.addEventListener("selectionchange", () => {
  if (S.timelineDirty && !timelineSelected()) render();
});
for (const type of ["pointerup", "pointercancel"]) {
  document.addEventListener(type, () => { S.pointerDown = false; }, true);
}
setInterval(() => {
  // Countdown on pending tool cards: update the label text only, so the
  // buttons next to it are never replaced under the user's cursor.
  for (const node of document.querySelectorAll("[data-expires]")) {
    node.textContent = `剩余 ${secondsLeft(node.dataset.expires)} 秒`;
  }
}, 1000);

let stagePolling = false;
setInterval(async () => {
  if (!S.cid || stagePolling || S.stageEdit) return;
  stagePolling = true;
  try { await loadStage(); } catch (_) { /* reconnect retains the last confirmed state */ }
  finally { stagePolling = false; }
}, 2000);

(async function boot() {
  try {
    const config = await (await fetch('/api/client-config')).json();
    S.desktop = config.desktop; S.developmentToken = config.development_token;
    if (S.desktop) {
      $('token').hidden = true; $('connectBtn').textContent = '重新连接'; $('settingsLink').hidden = false;
      $('desktopExit').hidden = false;
      $('desktopExit').onclick = async()=>{if(confirm('退出 Hub 后自动执行与额度等待将暂停。确认退出？')){await api('POST','/api/desktop/shutdown',{});setConn('', '服务已退出');}};
      const params = new URLSearchParams(location.hash.slice(1));
      const ticket = params.get('pair');
      if (ticket) {
        history.replaceState(null, '', location.pathname);
        const r = await fetch('/api/desktop/session', {method:'POST', headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket})});
        if (!r.ok) throw Error('配对已过期，请从开始菜单重新打开 Agent Hub');
      }
    }
  } catch(e) { toast(e.message); }
  let saved = "";
  try { saved = sessionStorage.getItem("agenthub.token") || ""; } catch (_) { /* storage blocked */ }
  $("token").value = saved;
  await connect();
  if (S.desktop && S.adapter && !S.adapter.agent_ids.length) location.assign('/settings');
})();
</script>
</body>
</html>
