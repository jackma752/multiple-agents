function stageCardView(s) {
  const [label, kind] = STAGE_LABEL[s.status] || [s.status, ""];
  const rules = s.rules || {};
  const cp = s.checkpoint || {};
  const lines = [el("div", { class: "usage-line" }, chip(label, kind), " ", s.goal.slice(0, 80)),
    el("div", { class: "usage-line dim" },
       `${s.execution_mode === "supervised" ? "用户监督" : "严格"} · ${PLAN_MODE_LABEL[rules.plan] || rules.plan}` +
       ` · 当前：${PHASE_LABEL[cp.phase] || cp.phase || "—"} · 调用 ${s.calls_used}/${rules.max_calls || '不限'}`)];
  if (STAGE_OPEN.includes(s.status)) {
    lines.push(el("div", { class: "row" },
      s.status === "paused"
        ? el("button", { class: "mini", disabled: S.busy.has("stage"), onclick: () => stageAction("resume") }, "继续")
        : el("button", { class: "mini", disabled: S.busy.has("stage"), onclick: () => stageAction("pause") }, "暂停"),
      el("button", { class: "mini danger", disabled: S.busy.has("stage"), onclick: () => stageAction("stop") }, "停止")));
  }
  if (s.status === "paused") lines.push(el("div", { class: "usage-line dim" }, "已暂停后续调度和工具授权；已经开始的调用可能仍在运行。停止会另行请求中断。"));
  for (const [step, wait] of Object.entries(cp.waits || {})) {
    lines.push(el("div", { class: "usage-line" }, `${step} · ${wait.agent}：` +
      (wait.reset_at ? `预计恢复 ${new Date(wait.reset_at).toLocaleString()}` : "额度恢复时间未知") +
      `；下次检查 ${new Date(wait.next_check_at).toLocaleString()}` +
      (wait.probe_invocation_id ? "；正在共用一次恢复探测" : "") + (!wait.auto_resume ? "；需点击继续" : "")));
  }
  const retries = Object.entries(cp.retry_counts || {});
  if (retries.length) lines.push(el("div", { class: "usage-line" }, "修复重试：" +
    retries.map(([step, n]) => `${step} ${n}/${rules.retry_limit}`).join("、")));
  if (s.status === "waiting_quota" && !rules.auto_resume) lines.push(
    el("button", { class: "mini", onclick: () => stageAction("resume") }, "继续（到期后检查额度）"));
  const sum = s.summary;
  for (const stop of cp.stop_requests || []) {
    lines.push(el("div", { class: "usage-line dim" }, `中断 ${stop.invocation_id}：` +
      (stop.remote_stop_confirmed ? "已确认结束" : stop.interrupt_accepted ? "已接受中断，等待结束确认" :
        `尚未确认停止（${stop.reason || "unsupported"}）；调用最终状态见记录`)));
  }
  if (sum) {
    const steps = (sum.steps || []).map((x) => `${x.step}（${x.agent}，${(CALL_LABEL[x.status] || [x.status])[0]}）`);
    if (steps.length) lines.push(el("div", { class: "usage-line" }, "步骤：" + steps.join(" → ")));
    const u = sum.usage || {};
    lines.push(el("div", { class: "usage-line dim" },
      `用量：输入 ${fmtN(u.input || 0)} / 输出 ${fmtN(u.output || 0)}` + (u.unknown ? `，另有 ${u.unknown} 次未知` : "")));
    if (sum.kind === "completed") {
      if (sum.review) lines.push(el("div", { class: "usage-line" }, `审阅：${sum.review}`));
      if (sum.result_message_id) lines.push(el("div", { class: "usage-line" }, `结果见消息 #${sum.result_message_id}`));
      lines.push(el("div", { class: "usage-line dim" }, sum.next));
    } else {
      lines.push(el("div", { class: "usage-line" },
        `${REASON_LABEL[sum.reason] || sum.reason}` + (sum.step ? `（步骤 ${sum.step}）` : "") +
        (sum.message ? `：${sum.message}` : "")));
      lines.push(el("div", { class: "usage-line" }, "已完成：" + ((sum.done || []).join("、") || "无")));
      lines.push(el("div", { class: "usage-line" }, "继续需要：" + sum.needs));
    }
  }
  const recent = (s.events || []).filter((x) => x.kind !== "started").slice(0, 6);
  if (recent.length) lines.push(el("div", { class: "usage-line dim" }, "最近：",
    ...recent.map((x) => el("div", {}, `${EVENT_LABEL[x.kind] || x.kind}` +
      (x.detail && x.detail.step ? ` ${x.detail.step}` : "") + (x.detail && x.detail.rule ? `：${x.detail.rule}` : "")))));
  return lines;
}

function renderAuto() {
  const bar = $("autoBar");
  const s = stageNow();
  const open = stageOpen();
  // Always reachable: state and pause/stop in the top bar while a stage is open.
  $("autoChip").hidden = !open;
  $("autoCtl").hidden = !open;
  if (open) {
    const [label, kind] = STAGE_LABEL[s.status] || [s.status, ""];
    $("autoChip").textContent = "自动：" + label;
    $("autoChip").className = "chip " + kind;
    $("autoCtl").replaceChildren(
      s.status === "paused" ? el("button", { class: "mini", onclick: () => stageAction("resume") }, "继续")
                            : el("button", { class: "mini", onclick: () => stageAction("pause") }, "暂停"),
      el("button", { class: "mini danger", onclick: () => stageAction("stop") }, "停止"));
  }
  bar.hidden = !S.cid || !S.stage;
  const active = document.activeElement;
  if (bar.hidden || (bar.contains(active) && active.matches(".stage-form textarea, .stage-form input:not([type=checkbox])"))) return;
  const lines = [];
  if (s) lines.push(...stageCardView(s));
  if (!open) {
    if (S.stageEdit) lines.push(stageFormView(S.stageEdit));
    else lines.push(el("div", { class: "usage-line" }, "手动模式（逐次同意）",
      el("button", { class: "mini", onclick: editStage }, s ? "开启新阶段" : "设置自动执行")));
  }
  bar.replaceChildren(...lines);
}

/* ---------------------------------------- collaboration plans (P4) --- */

async function loadPlans(gen = S.viewGen) {
  if (!S.cid || !current(gen)) return;
  const cid = S.cid;
  const data = await api("GET", `/api/conversations/${enc(cid)}/plans`);
  if (!current(gen) || cid !== S.cid) return;
  S.plans = data;
  render();
}

const ITEM_STATE = { pending: ["待分派", ""], awaiting: ["待审批", "warn"], running: ["执行中", "info"],
                     unconfirmed: ["状态待确认", "warn"], done: ["完成", "ok"], no_result: ["已结束、无回复", "warn"],
                     failed: ["失败", "bad"] };

function editPlan(items, fromMessageId) {
  S.planEdit = { from_message_id: fromMessageId || null,
                 items: (items && items.length ? items : [{ agent_id: $("agent").value, goal: "", depends_on: [] }])
                   .map((i) => ({ agent_id: i.agent_id, goal: i.goal, deps: (i.depends_on || []).join(", "),
                                  unknown: !!i.unknown_agent })) };
  render();
}

async function savePlan() {
  const e = S.planEdit;
  const items = e.items.map((i) => ({ agent_id: i.agent_id, goal: i.goal,
    depends_on: i.deps.split(/[,，\s]+/).filter(Boolean).map(Number) }));
  await guarded("plan", async () => {
    await api("POST", `/api/conversations/${enc(S.cid)}/plans`, { items, from_message_id: e.from_message_id });
    S.planEdit = null;
    toast("协作计划已保存：每个子任务需要分别分派并审批");
    await loadPlans();
  });
}

async function draftPlanFromReply(m) {
  const draft = await api("GET", `/api/conversations/${enc(S.cid)}/plan-draft`, undefined, { message_id: m.message_id });
  if (!draft.items.length) { toast("这条回复里没有读到“1. agent: 目标”格式的计划行"); return; }
  editPlan(draft.items, draft.from_message_id);
}

function askForPlan() {
  $("text").value = S.plans.instruction + "\n\nTask:\n" + $("text").value;
  toast("已填入拆分任务的请求：补全任务后发送，主 Agent 的回复可以读成协作计划");
  render();
}

async function toggleCollaboration(on) {
  const u = S.usageConv, rootId = u && u.root_task && u.root_task.root_task_id;
  if (!rootId) { toast("先发送一条消息建立任务，才能设置协作扩展"); return; }
  await guarded("collab", async () => {
    const r = await api("PATCH", `/api/tasks/${enc(rootId)}/policy`, { ...u.budget.policy, collaboration_enabled: on });
    toast(`协作扩展已${on ? "开启" : "关闭"}（策略 v${r.version}；撤销了 ${r.revoked_approvals} 个未消费的审批）`);
    needUsage(); needMessages();
  });
}

async function dispatchItem(plan, item) {
  const mode = $("mode").value;
  if (mode !== "strict" && mode !== "supervised") { toast("请先在输入框下方选择执行模式"); return; }
  await guarded(`dispatch:${plan.plan_id}:${item.index}`, async () => {
    S.scrollAfter = S.lastMsgId;
    await api("POST", `/api/conversations/${enc(S.cid)}/plans/${plan.plan_id}/items/${item.index}/dispatch`, {
      execution_mode: mode, ...selectionFor(item.agent_id), client_request_id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()) });
    toast(`子任务 #${item.index} 已生成待审批调用`);
    needMessages(); await loadPlans();
  });
}

async function collectPlan(plan) {
  const mode = $("mode").value;
  if (mode !== "strict" && mode !== "supervised") { toast("请先在输入框下方选择执行模式"); return; }
  await guarded(`collect:${plan.plan_id}`, async () => {
    S.scrollAfter = S.lastMsgId;
    await api("POST", `/api/conversations/${enc(S.cid)}/plans/${plan.plan_id}/collect`, {
      agent_id: $("agent").value, execution_mode: mode, ...selectionFor(),
      client_request_id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()) });
    toast(`已生成汇总调用，交给 ${$("agent").value}，待审批`);
    needMessages();
  });
}

function renderPlans() {
  const bar = $("planBar");
  const p = S.plans;
  bar.hidden = !S.cid || !p || (!S.messages.length && !p.plans.length);
  const active = document.activeElement;
  if (bar.hidden || (bar.contains(active) && active.matches(".plan-form textarea, .plan-form input, .plan-form select"))) return;
  const lines = [el("div", { class: "usage-line" }, el("strong", {}, "协作计划 "),
    p.collaboration_enabled ? chip("协作扩展已开启", "ok") : chip("协作扩展已关闭", ""),
    " ", el("button", { class: "mini", disabled: S.busy.has("collab"), onclick: () => toggleCollaboration(!p.collaboration_enabled) },
             p.collaboration_enabled ? "关闭" : "开启"),
    el("button", { class: "mini", onclick: askForPlan }, "请主 Agent 拆分任务"),
    el("button", { class: "mini", onclick: () => editPlan() }, "写协作计划"))];
  const plan = p.plans[0];
  if (plan) {
    lines.push(el("div", { class: "usage-line dim" }, `计划 #${plan.plan_id}（${plan.source === "manual" ? "手写" : "由主 Agent 提议"}）：每个子任务单独分派、单独审批；依赖完成后才能分派`));
    for (const item of plan.items) {
      const [label, kind] = ITEM_STATE[item.state] || [item.state, ""];
      const waiting = item.depends_on.filter((d) => (plan.items.find((x) => x.index === d) || {}).state !== "done");
      lines.push(el("div", { class: "usage-line" }, chip(`#${item.index} ${item.agent_id}`, "info"), " ", chip(label, kind),
        item.depends_on.length ? ` 依赖 ${item.depends_on.join("、")}${waiting.length ? "（等待中）" : ""} ` : " ",
        item.goal.slice(0, 80), item.attempts ? `（第 ${item.attempts} 次）` : "", " ",
        item.state === "unconfirmed" ? "上一次调用状态未知，可能仍在运行；名额保留，需先经恢复或人工裁决确认结束，才能决定是否重试 " : null,
        item.ready ? el("button", { class: "mini", disabled: S.busy.has(`dispatch:${plan.plan_id}:${item.index}`) || !p.collaboration_enabled,
                                    onclick: () => dispatchItem(plan, item) }, item.state === "pending" ? "分派" : "重试") : null));
    }
    if (plan.all_done) lines.push(el("div", { class: "usage-line" }, "全部完成 ",
      el("button", { class: "mini", disabled: S.busy.has(`collect:${plan.plan_id}`), onclick: () => collectPlan(plan) },
         `把结果汇总交给 ${$("agent").value}`)));
  }
  if (S.planEdit) {
    const e = S.planEdit;
    const agents = (S.adapter && S.adapter.agent_ids && S.adapter.agent_ids.length) ? S.adapter.agent_ids : ["mock"];
    lines.push(el("div", { class: "plan-form" },
      e.from_message_id ? el("div", { class: "dim" }, `草稿来自回复 #${e.from_message_id}，保存前可修改`) : null,
      ...e.items.map((item, n) => el("div", { class: "row" }, `#${n + 1}`,
        el("select", { onchange: (ev) => { item.agent_id = ev.target.value; item.unknown = false; } },
          ...agents.map((a) => el("option", { value: a, selected: a === item.agent_id ? "selected" : null }, a))),
        item.unknown ? chip(`未知 Agent：${item.agent_id}`, "bad") : null,
        el("textarea", { rows: "2", style: "flex:1", placeholder: "子任务目标（自足：子任务只看到目标和它依赖的结果）",
                         oninput: (ev) => { item.goal = ev.target.value; } }, item.goal),
        el("input", { style: "width:80px", placeholder: "依赖 如 1,2", value: item.deps,
                      oninput: (ev) => { item.deps = ev.target.value; } }),
        el("button", { class: "mini", onclick: () => { e.items.splice(n, 1); render(); } }, "删除"))),
      el("div", { class: "row" },
        e.items.length < 5 ? el("button", { onclick: () => { e.items.push({ agent_id: $("agent").value, goal: "", deps: "", unknown: false }); render(); } }, "加一项") : null,
        el("button", { class: "primary", disabled: S.busy.has("plan"), onclick: savePlan }, "保存计划"),
        el("button", { onclick: () => { S.planEdit = null; render(); } }, "取消"))));
  }
  bar.replaceChildren(...lines);
}

async function loadMessages(gen = S.viewGen) {
  if (!S.cid || !current(gen)) return;
  const cid = S.cid;
  for (;;) {
    const page = await api("GET", `/api/conversations/${enc(cid)}/messages`, undefined,
                           { after_id: S.lastMsgId, limit: 200 });
    if (!current(gen) || cid !== S.cid) return;  // the view moved on while we waited
    page.messages.forEach(absorbMessage);
    if (!page.has_more) break;
  }
  render();
  needUsage(gen);
}

function needMessages(gen = S.viewGen) {
  clearTimeout(S.msgTimer);
  S.msgTimer = setTimeout(() => loadMessages(gen).catch((e) => {
    if (current(gen)) toast("读取消息失败：" + e.message);
  }), 60);
}

async function fetchCard(id, gen = S.viewGen) {
  try {
    const card = await api("GET", `/api/tool-approvals/${enc(id)}`);
    if (!current(gen)) return;
    S.cards.set(id, card);
    render();
  } catch (e) { if (current(gen)) toast("读取工具审批卡失败：" + e.message); }
}

async function fetchCallError(id, gen = S.viewGen) {
  const message = S.messages.find((m) => m.invocation && m.invocation.invocation_id === id);
  if (!message || !S.cid) return;
  const page = await api("GET", `/api/conversations/${enc(S.cid)}/messages`, undefined,
                         { after_id: message.message_id - 1, limit: 1 });
  if (!current(gen)) return;
  const saved = page.messages.find((m) => m.invocation && m.invocation.invocation_id === id);
  if (saved) { patch(call(id), { error: saved.invocation.error }); render(); }
}

/* Apply one stored event exactly once, in seq order, if it belongs to the view on screen. */
function apply(ev, gen = S.viewGen) {
  if (!current(gen)) return;
  if (typeof ev.seq !== "number" || ev.seq <= S.lastSeq) return;
  S.lastSeq = ev.seq;
  const p = ev.payload || {};
  switch (ev.type) {
    case "message.created":
      if (p.role === "user" && p.invocation_id) {
        patch(call(p.invocation_id), { status: p.invocation_status, approval_id: p.approval_id,
                                       approval_status: p.approval_status });
      }
      needMessages(gen);
      break;
    case "approval.status":
      patch(call(p.invocation_id), { approval_id: p.approval_id, approval_status: p.to });
      break;
    case "invocation.status":
      patch(call(p.invocation_id), { status: p.to, approval_status: p.approval_status });
      if (p.to === "failed" || p.to === "unknown") fetchCallError(p.invocation_id, gen)
        .catch((e) => { if (current(gen)) toast("读取失败原因失败：" + e.message); });
      // Settled (also failed / interrupted / unknown): its ledger row now exists.
      if (SETTLED.includes(p.to)) needUsage(gen);
      break;
    case "stream.turn_started":
      call(p.invocation_id).turn = { thread_id: p.thread_id, turn_id: p.turn_id, resumed: p.resumed };
      break;
    case "stream.delta": {
      const c = call(p.invocation_id);
      if (typeof p.text === "string") c.stream += p.text; else c.gap = true;
      break;
    }
    case "stream.turn_ended":
      call(p.invocation_id).ended = { turn_status: p.turn_status, verdict: p.verdict, terminal: p.terminal,
                                      native_unfinished: p.native_unfinished || [] };
      break;
    case "stream.request_declined":
      call(p.invocation_id).declined.push(p.method);
      break;
    case "stream.native_agent_observed":
      call(p.invocation_id).native.push(p);
      break;
    case "native_agent.status":
      fetchCard(p.tool_approval_id, gen);
      needUsage(gen);
      break;
    case "task.interrupt_requested": {
      // The effective point (from any client): tool decisions closed first.
      const c = call(p.invocation_id);
      c.interrupt = { ...(c.interrupt || {}), interrupt_requested: true, pending: false,
                      closure: { closed_cards: p.closed_cards || 0, blocked_decisions: p.blocked_decisions || 0,
                                 in_flight: p.in_flight || 0, already_sent: p.already_sent || 0 } };
      break;
    }
    case "task.interrupt_acknowledged": {
      const c = call(p.invocation_id);
      c.interrupt = { ...(c.interrupt || {}), interrupt_requested: true, pending: false,
                      interrupt_accepted: p.accepted, reason: p.code };
      break;
    }
    case "tool_approval.requested": {
      const c = call(p.invocation_id);
      if (!c.cards.includes(p.tool_approval_id)) c.cards.push(p.tool_approval_id);
      if (!S.cards.has(p.tool_approval_id)) S.cards.set(p.tool_approval_id, { ...p, loading: true });
      fetchCard(p.tool_approval_id, gen);
      break;
    }
    case "tool_approval.status":
    case "tool_approval.delivery": {
      const card = S.cards.get(p.tool_approval_id);
      if (card) {
        if (ev.type === "tool_approval.status") card.status = p.to;
        else { card.delivery = p.delivery; card.decision_sent = p.decision_sent; }
      }
      fetchCard(p.tool_approval_id, gen);
      break;
    }
    default:
      if (ev.type.startsWith("task.")) {
        const names = { "task.tree_stop": "任务树已停止：不会再调度新调用",
                        "task.tree_pause": "任务树已暂停", "task.tree_resume": "任务树已恢复",
                        "task.local_stop_requested": "已请求停止本地进程（远端停止未确认）",
                        "task.unknown_settled": "未知状态已人工裁决",
                        "task.policy_updated": `策略已更新为 v${p.version}（配额或预算变更）；` +
                                               `撤销了 ${p.revoked_approvals ?? 0} 个未消费的审批` };
        S.banner = names[ev.type] || ev.type;
        if (ev.type === "task.policy_updated") needUsage(gen);  // the budget shown changed
      }
  }
  scheduleRender();
}

/* --------------------------------------------------------- SSE (fetch) --- */

function setConn(kind, text) {
  const chip = $("connChip");
  chip.className = "chip " + ({ live: "ok", retry: "warn", error: "bad" }[kind] || "");
  chip.textContent = text;
}

function parseBlock(block, gen) {
  let data = null;
  for (const line of block.split("\n")) {
    if (!line || line.startsWith(":")) continue;
    const i = line.indexOf(":");
    const key = i < 0 ? line : line.slice(0, i);
    let value = i < 0 ? "" : line.slice(i + 1);
    if (value.startsWith(" ")) value = value.slice(1);
    if (key === "data") data = data === null ? value : data + "\n" + value;
  }
  if (data === null) return;
  let ev;
  try { ev = JSON.parse(data); } catch (_) { return; /* malformed frame: ignored, seq unchanged */ }
  apply(ev, gen);
}

function stopStream() {
  if (S.streamCtrl) S.streamCtrl.abort();
  S.streamCtrl = null;
}

async function resync(gen) {
  // The stored stream no longer matches our cursor (e.g. database replaced).
  // Rebuild completely: clear, reload messages, and let the caller reconnect
  // from seq 0 so text, turn state and tool cards are replayed in order.
  if (!current(gen)) return;
  S.stats.resyncs += 1;
  exposeStats();
  resetConversationState();
  render();
  await loadMessages(gen);
}

async function follow(gen, cid) {
  let backoff = 500;
  let first = true;
  while (current(gen)) {
    const ctrl = new AbortController();
    S.streamCtrl = ctrl;
    try {
      if (!first) { S.stats.reconnects += 1; exposeStats(); }
      first = false;
      const r = await fetch(`/api/conversations/${enc(cid)}/events/stream?timeout=25`, {
        headers: { "Authorization": "Bearer " + S.token, "Accept": "text/event-stream",
                   "Last-Event-ID": String(S.lastSeq) },
        signal: ctrl.signal,
      });
      if (!current(gen)) { ctrl.abort(); return; }
      if (r.status === 409) { await resync(gen); continue; }
      if (r.status === 401 || r.status === 403 || r.status === 404) {
        setConn("error", r.status === 404 ? "会话不存在" : "token 无效");
        return;
      }
      if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
      setConn("live", "实时");
      backoff = 500;
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (!current(gen)) { ctrl.abort(); return; }
        if (done) break;
        buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
        let cut;
        while ((cut = buf.indexOf("\n\n")) >= 0) {
          parseBlock(buf.slice(0, cut), gen);
          buf = buf.slice(cut + 2);
        }
      }
      // A clean end is the server's timeout: reconnect from the last seq,
      // keeping everything already shown.
    } catch (e) {
      if (!current(gen)) return;
      setConn("retry", "重连中…");
      await sleep(backoff);
      backoff = Math.min(backoff * 2, 5000);
    }
  }
}

/* ----------------------------------------------------------- actions --- */

async function guarded(key, fn) {
  if (S.busy.has(key)) return;
  S.busy.add(key); render();
  try { await fn(); } catch (e) { toast(e.message); } finally { S.busy.delete(key); render(); }
}

function approveAndRun(c) {
  return guarded("run:" + c.id, async () => {
    try {
      if (c.approval_status === "pending") {
        // A supervised call is approved only with ITS OWN ticked consent;
        // the server checks it again (boundary_consent_required).
        const body = c.execution_mode === "supervised"
          ? { accept_unmanaged_native_agents: S.consent.get(c.id) === true } : undefined;
        await api("POST", `/api/approvals/${enc(c.approval_id)}/approve`, body);
      }
    } finally {
      S.consent.delete(c.id);  // never carried over, not even to a retry of this call
    }
    const res = await api("POST", `/api/invocations/${enc(c.id)}/run`);
    patch(c, { status: res.status });
  });
}

function runApproved(c) {
  return guarded("run:" + c.id, async () => {
    const res = await api("POST", `/api/invocations/${enc(c.id)}/run`);
    patch(c, { status: res.status });
  });
}

function rejectCall(c) {
  return guarded("run:" + c.id, () => api("POST", `/api/approvals/${enc(c.approval_id)}/reject`));
}

function stopLocal(c) {
  if (!confirm("“停止本地进程”会停止这次调用所在的整个任务（包括其中的自动阶段或论文研究），之后不能再继续调度；不能撤销。\n\n" +
               "只想暂停或结束自动执行，请用顶部的“暂停”或“停止”。确认停止整个任务？")) return;
  return guarded("stop:" + c.id, async () => {
    c.stop = await api("POST", `/api/invocations/${enc(c.id)}/stop-local`);
  });
}

function settleEnded(c) {
  if (!confirm("确认这次调用及相关执行已结束？将人工登记为超时并释放名额，保留现有文件；不会重跑任务，也不表示产物已验收。若仍在运行，请先停止并核实。")) return;
  return guarded("settle:" + c.id, async () => {
    const r = await api("POST", `/api/invocations/${enc(c.id)}/reconcile`, { action: "settle", outcome: "timed_out" });
    patch(c, { status: r.outcome });
    await loadStage(); needUsage(); needMessages();
    toast("已登记结束，现有文件保留。可到本机设置调整后续调用的执行时限。");
  });
}

function interruptCall(c) {
  return guarded("interrupt:" + c.id, async () => {
    c.interrupt = { interrupt_requested: true, pending: true };
    render();
    const res = await api("POST", `/api/invocations/${enc(c.id)}/interrupt`);
    c.interrupt = res;
    patch(c, { status: res.status });
  });
}

function answerCard(card, decision) {
  const gen = S.viewGen;
  return guarded("card:" + card.tool_approval_id, async () => {
    const body = decision === "approve" ? { card_hash: card.card_hash } : undefined;
    const updated = await api("POST", `/api/tool-approvals/${enc(card.tool_approval_id)}/${decision}`, body);
    if (current(gen)) S.cards.set(updated.tool_approval_id, updated);
  });
}

async function send(event) {
  event.preventDefault();
  const text = $("text").value;
  const mode = $("mode").value;
  if (!text.trim()) return;
  if (mode !== "strict" && mode !== "supervised") { toast("请先选择执行模式（严格或用户监督）"); return; }
  await guarded("send", async () => {
    // A creation already in flight (e.g. "+ 新会话" just clicked) is the one
    // this message goes to; otherwise create one. Never a second conversation.
    if (S.createPromise) await S.createPromise;
    if (!S.cid) await createConversation("");  // the server titles it from this message
    const cid = S.cid;
    const gen = S.viewGen;
    const untitled = !(S.convs.find((c) => c.conversation_id === cid) || {}).title;
    S.scrollAfter = S.lastMsgId;
    const turn = await api("POST", `/api/conversations/${enc(cid)}/invocations`, {
      text, agent_id: $("agent").value, execution_mode: mode, ...selectionFor(),
      client_request_id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
      context_mode: $("resume").checked ? "native_resume" : "independent",
      handoff_message_ids: S.handoff.slice(),
      file_refs: S.refs.slice(),
      summary_id: S.attachSummary, include_history: S.includeHistory,
      output_style: $("outputStyle").value,
      native_subagents: $("nativeAgents").value,
    });
    if (current(gen)) patch(call(turn.invocation_id), turn);
    $("text").value = "";
    $("resume").checked = false;
    S.handoff = [];  // a handoff belongs to one call; the next one chooses again
    S.refs = []; S.sendPreview = null; S.suggestions = [];  // likewise the referenced files
    S.includeHistory = false;  // a summary stays attached until removed; history is per drafting call
    renderSuggestions();
    $("mode").value = "";  // the next call needs its own explicit choice
    $("nativeAgents").value = "disabled";
    if (current(gen)) needMessages(gen);
    if (untitled) await loadConvs();  // its first message just gave it a title
  });
}

/* ------------------------------------------------- file references --- */

/* What the composer would send now (nothing is created): the same composition the
   server will bind into the approval when the message is sent. */
async function previewSend(refs = S.refs) {
  if (!refs.length && !S.handoff.length && S.attachSummary == null && !S.includeHistory && !$("outputStyle").value) {
    S.sendPreview = null; renderComposer(); return true;
  }
  try {
    S.sendPreview = await api("POST", "/api/context-preview", {
      conversation_id: S.cid || null, text: $("text").value, agent_id: $("agent").value,
      context_mode: $("resume").checked ? "native_resume" : "independent",
      handoff_message_ids: S.handoff.slice(), file_refs: refs,
      summary_id: S.attachSummary, include_history: S.includeHistory,
      output_style: $("outputStyle").value,
    });
    renderComposer();
    return true;
  } catch (err) {
    toast(err.message);
    return false;
  }
}

async function addRef(spec = $("fileRef").value.trim()) {
  if (!spec) return;
  if (S.refs.includes(spec)) { toast("已经引用了这一项"); return; }
  if (S.refs.length >= 8) { toast("一次最多引用 8 项"); return; }
  if (await previewSend([...S.refs, spec])) {
    S.refs.push(spec);
    if ($("fileRef").value.trim() === spec) $("fileRef").value = "";
    renderComposer();
    loadSuggestions();
  }
}

function removeRef(spec) {
  S.refs = S.refs.filter((s) => s !== spec);
  previewSend();
  loadSuggestions();
}

/* Suggestions from the message's paths, the chosen files and this conversation's
   recent references. Shown only; each needs a click to become a reference. */
async function loadSuggestions() {
  if (!S.token) return;
  try {
    const data = await api("POST", "/api/file-suggestions", {
      conversation_id: S.cid || null, text: $("text").value, file_refs: S.refs.slice() });
    S.suggestions = data.suggestions;
  } catch (_) { S.suggestions = []; /* no files root: nothing to suggest */ }
  renderSuggestions();
}

const SUGGEST_REASON = { mentioned: "消息提到", mentioned_line: "消息提到的行附近", related: "与已选文件相关",
                         recent: "本会话最近引用" };

function renderSuggestions() {
  const items = S.suggestions.filter((s) => !s.spec || !S.refs.includes(s.spec));
  $("suggestions").replaceChildren(...(items.length ? [el("span", { class: "dim" }, "建议引用：")] : []),
    ...items.map((s) => el("span", { class: "chip" },
      `${SUGGEST_REASON[s.reason] || s.reason}：${s.spec || s.path}` +
      (s.needs_range ? `（整文件 ${fmtN(s.lines)} 行、约 ${fmtN(s.estimate)} token，较大，请指定行范围）`
                     : `（约 ${fmtN(s.estimate)} token）`),
      s.needs_range
        ? el("button", { type: "button", class: "mini", onclick: () => { $("fileRef").value = s.path + ":L"; $("fileRef").focus(); } }, "指定范围")
        : el("button", { type: "button", class: "mini", onclick: () => addRef(s.spec) }, "加入"))));
}

async function suggestFiles() {
  const q = $("fileRef").value.replace(/^@/, "").replace(/^"|"?(:L?\d+(-L?\d+)?)?$/gi, "");
  if (!S.token) return;
  try {
    const data = await api("GET", "/api/files", undefined, { q, limit: 30 });
    $("fileList").replaceChildren(...data.files.map((f) => el("option", { value: f })));
  } catch (_) { $("fileList").replaceChildren(); /* no files root: adding explains why */ }
}

function debounced(fn, ms) {
  let t = null;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function renderSendPreview() {
  const p = S.sendPreview && S.sendPreview.context_preview;
  if (!p) { $("sendPreview").replaceChildren(); return; }
  const warn = budgetWarning(S.sendPreview.budget);
  $("sendPreview").replaceChildren(
    ...(warn ? [el("div", { class: "note" }, el("span", { class: "chip bad" }, "预算"), " " + warn)] : []),
    el("details", { class: "sent" },
      el("summary", {}, "发送前预览：" + contextSummary(p).replace(/^上下文预览：/, "")),
      contextLines(p).map((t) => el("div", { class: "note" }, t)),
      el("pre", { class: "mono" }, S.sendPreview.sent_text)));
}

/* Over the budget the user narrows the references; nothing is trimmed or widened. */
function budgetWarning(b) {
  if (!b || !b.decision || b.decision.allowed) return "";
  if (b.decision.code === "estimate_exceeds_per_call_budget")
    return `估算约 ${fmtN(b.estimate)} token，超过单次预算 ${fmtN(b.per_call)}：请缩小引用的行范围或移除引用（不会自动截断）`;
  return `按当前预算，执行时会被拒绝：${b.decision.message || b.decision.code}`;
}

/* ----------------------------------------------------- conversations --- */

async function loadConvs() {
  const [data, archived] = await Promise.all([
    api("GET", "/api/conversations", undefined, { limit: 100 }),
    api("GET", "/api/conversations", undefined, { limit: 100, archived: "true" }).catch(() => ({ conversations: [] })),
  ]);
  S.convs = data.conversations;
  S.archivedConvs = archived.conversations;
  renderConvs();
  needUsage();
}

function resetConversationState() {
  S.lastSeq = 0; S.lastMsgId = 0; S.messages = []; S.calls = new Map(); S.cards = new Map();
  S.rawReplies = new Set();
  S.consent = new Map(); S.banner = ""; S.handoff = []; S.usageConv = null;
  S.summaries = []; S.summaryLink = {}; S.attachSummary = null; S.includeHistory = false; S.summaryEdit = null;
  S.plans = null; S.planEdit = null; S.scrollAfter = null; S.stage = null; S.stageEdit = null;
}

/* The only way to create a conversation: concurrent callers share one creation. */
function createConversation(title) {
  if (!S.createPromise) {
    S.createPromise = (async () => {
      const conv = await api("POST", "/api/conversations", { title });
      S.stats.created += 1;
      await loadConvs();
      await select(conv.conversation_id);
      return conv.conversation_id;
    })().finally(() => { S.createPromise = null; render(); });
    render();
  }
  return S.createPromise;
}

async function select(cid) {
  // A new view generation first: from here on, results of the previous view
  // (messages, cards, its stream, a resync it started) are ignored.
  const gen = ++S.viewGen;
  stopStream();
  S.cid = cid;
  resetConversationState();
  if (location.hash.slice(1) !== cid) history.replaceState(null, "", "#" + cid);
  renderConvs(); render();
  try {
    await loadMessages(gen);
    await loadSummaries(gen);
  } catch (e) {
    if (current(gen)) toast("读取消息失败：" + e.message);
  }
  if (!current(gen)) return;  // another select() won while messages loaded
  follow(gen, cid);
}

/* ---------------------------------------------- stage summaries (T-2) --- */

async function loadSummaries(gen = S.viewGen) {
  if (!S.cid || !current(gen)) return;
  const data = await api("GET", `/api/conversations/${enc(S.cid)}/summaries`);
  if (!current(gen)) return;
  S.summaries = data.summaries;
  S.summaryLink = { parent: data.parent_conversation_id, summary: data.continued_from_summary_id };
  S.summaryInstruction = data.instruction;
  // A conversation that continues another starts with its summary attached (removable).
  if (S.summaryLink.summary && !S.messages.length && S.attachSummary == null) S.attachSummary = S.summaryLink.summary;
  render();
  previewSend();
}

const SUMMARY_FIELDS = [["goal", "目标（必填）"], ["constraints", "约束"], ["done", "已完成"],
                        ["open_issues", "未解决"], ["next_steps", "下一步"]];

function editSummary(from) {
  S.summaryEdit = { ...Object.fromEntries(SUMMARY_FIELDS.map(([k]) => [k, (from && from[k]) || ""])),
                    file_refs: ((from && from.file_refs) || []).join("\n"),
                    from_message_id: (from && from.from_message_id) || null };
  render();
}

async function saveSummary() {
  const form = document.querySelector(".summary-form");
  const body = Object.fromEntries(SUMMARY_FIELDS.map(([k]) => [k, form.querySelector(`[name=${k}]`).value]));
  body.file_refs = form.querySelector("[name=file_refs]").value.split("\n").map((s) => s.trim()).filter(Boolean);
  body.from_message_id = S.summaryEdit.from_message_id;
  await guarded("summary", async () => {
    const saved = await api("POST", `/api/conversations/${enc(S.cid)}/summaries`, body);
    S.summaryEdit = null;
    toast(`已保存阶段摘要 v${saved.version}`);
    await loadSummaries();
  });
}

async function draftFromReply(m) {
  const draft = await api("GET", `/api/conversations/${enc(S.cid)}/summary-draft`, undefined, { message_id: m.message_id });
  editSummary(draft);
}

function draftSummary() {
  $("text").value = S.summaryInstruction;
  S.includeHistory = true;
  toast("已填入摘要请求并附带最近历史：选择 Agent 和模式后发送，审批后得到草稿");
  render();
  previewSend();
}

async function compressFrom(summary) {
  await guarded("compress", async () => {
    const conv = await api("POST", `/api/conversations/${enc(S.cid)}/compress`, { summary_id: summary.summary_id });
    await loadConvs();
    await select(conv.conversation_id);
    toast(`已用摘要 v${summary.version} 开启新会话；原会话保留，可从左侧回看`);
  });
}

function renderSummary() {
  const bar = $("summaryBar");
  bar.hidden = !S.cid || (!S.summaries.length && !S.messages.length && !S.summaryLink.parent);
  const active = document.activeElement;
  if (bar.hidden || (bar.contains(active) && active.matches(".summary-form textarea"))) return;
  const latest = S.summaries[0];
  const parent = S.summaryLink.parent && S.convs.find((c) => c.conversation_id === S.summaryLink.parent);
  const lines = [];
  if (S.summaryLink.parent) {
    const from = S.summaries.find((s) => s.summary_id === S.summaryLink.summary);
    lines.push(el("div", { class: "usage-line" }, `从会话「${(parent && parent.title) || S.summaryLink.parent}」压缩继续` +
      (from ? `（摘要 v${from.version}）` : "") + "；原会话保留 ",
      el("button", { class: "mini", onclick: () => select(S.summaryLink.parent) }, "回看原会话")));
  }
  lines.push(el("div", { class: "usage-line" }, el("strong", {}, "阶段摘要 "),
    latest ? `v${latest.version}（${latest.source === "manual" ? "手写" : "由草稿编辑"}，${fmtN(latest.chars)} 字）目标：${latest.goal.slice(0, 60)}`
           : "还没有摘要",
    " ",
    latest ? el("button", { class: "mini" + (S.attachSummary === latest.summary_id ? " on" : ""),
                            onclick: () => { S.attachSummary = S.attachSummary === latest.summary_id ? null : latest.summary_id; render(); previewSend(); } },
                S.attachSummary === latest.summary_id ? "已附带到下一条（点此取消）" : "附带到下一条") : null,
    el("button", { class: "mini", onclick: () => editSummary(latest) }, latest ? "编辑（存为新版本）" : "写摘要"),
    S.messages.length ? el("button", { class: "mini", onclick: draftSummary }, "生成摘要草稿") : null,
    latest ? el("button", { class: "mini", disabled: S.busy.has("compress"), onclick: () => compressFrom(latest) }, "压缩并继续") : null,
  ));
  if (S.summaryEdit) {
    const e = S.summaryEdit;
    lines.push(el("div", { class: "summary-form" },
      e.from_message_id ? el("div", { class: "dim" }, `草稿来自回复 #${e.from_message_id}，保存前可修改`) : null,
      // Each field writes back as it is typed, so a re-render never loses an edit.
      ...SUMMARY_FIELDS.map(([k, label]) => el("label", { class: "summary-field" }, label,
        el("textarea", { name: k, rows: k === "goal" ? "2" : "3", oninput: (ev) => { e[k] = ev.target.value; } }, e[k]))),
      el("label", { class: "summary-field" }, "必要文件引用（每行一个，如 src/app.py:L10-20）",
        el("textarea", { name: "file_refs", rows: "2", oninput: (ev) => { e.file_refs = ev.target.value; } }, e.file_refs)),
      el("div", { class: "row" },
        el("button", { class: "primary", disabled: S.busy.has("summary"), onclick: saveSummary }, "保存为新版本"),
        el("button", { onclick: () => { S.summaryEdit = null; render(); } }, "取消"))));
  }
  bar.replaceChildren(...lines);
}

/* ------------------------------------------------------------ render --- */

const CALL_LABEL = {
  awaiting_approval: ["待你同意", "warn"], queued: ["已同意，待执行", "info"],
  starting: ["执行中", "info"], running: ["执行中", "info"], succeeded: ["已完成", "ok"],
  failed: ["失败", "bad"], canceled: ["已取消（provider 确认已中断）", "warn"], timed_out: ["超时", "bad"],
  unknown: ["状态未知：名额保留，需人工裁决", "bad"], rejected: ["已拒绝", ""],
  invalid: ["已失效", ""], draft: ["草稿", ""],
};
const CARD_LABEL = {
  pending: ["等待你决定", "warn"], approved: ["已批准", "ok"], declined: ["已拒绝", ""],
  expired: ["已过期（按拒绝处理）", ""], void: ["已作废（请求已结束）", ""],
};
const METHOD_LABEL = {
  "claude/PreToolUse": "Claude 请求使用工具或启动子 Agent",
  "item/commandExecution/requestApproval": "Agent 请求执行命令",
  "item/fileChange/requestApproval": "Agent 请求修改文件",
  "item/permissions/requestApproval": "Agent 请求权限",
};
const DETAIL_LABEL = { command: "命令（原文）", command_view: "命令（拆开后）", cwd: "目录",
  native_hook: "本次工具请求（含子 Agent 来源及完整参数）",
  reason: "理由（模型提供的说明）", reason_source: null, path: "路径", grantRoot: "授权范围",
  changes: "文件变更", additionalPermissions: "本次命令申请的额外权限", networkApprovalContext: "网络授权范围",
  approval_scope: null, approval_block_reason: "当前不能允许的原因",
  kind: "操作类型", environmentId: "执行环境", provider_available_decisions: null };

function fileChangesView(changes) {
  if (!Array.isArray(changes)) return JSON.stringify(changes);
  return changes.map((x) => {
    const kind = typeof x.kind === "string" ? x.kind : (x.kind || {}).type;
    const label = ({add:"新增", update:"修改", delete:"删除", move:"移动"})[kind] || kind || "变更";
    const moved = x.kind && x.kind.move_path ? ` → ${x.kind.move_path}` : "";
    return `${x.path || "（路径未知）"}${moved}\n${label}\n${x.diff || "（未提供差异）"}`;
  }).join("\n\n");
}

function commandView(v) {
  if (!v || !v.parsed) return "无法可靠拆分，只看上面的原文（不显示改写后的命令）";
  if (v.inner_command !== undefined)
    return `外层程序：${v.shell} ${(v.shell_flags || []).join(" ")}\n内层命令：${v.inner_command}`;
  return (v.argv || []).join(" ‖ ");
}

function acceptOffered(card) {
  return !Array.isArray(card.available_decisions) || card.available_decisions.includes("accept");
}

function chip(text, kind) { return el("span", { class: "chip " + (kind || "") }, text); }

function secondsLeft(iso) {
  return Math.max(0, Math.round((Date.parse(iso) - Date.now()) / 1000));
}

function renderCard(id) {
  const card = S.cards.get(id);
  if (!card) return null;
  const [label, kind] = CARD_LABEL[card.status] || [card.status, ""];
  const pending = card.status === "pending";
  const busy = S.busy.has("card:" + id);
  const details = card.details || {};
  const rows = Object.entries(details).filter(([k]) => DETAIL_LABEL[k] !== null).map(([k, v]) => [
    el("dt", {}, DETAIL_LABEL[k] || k),
    el("dd", { class: ["command", "command_view", "changes"].includes(k) ? "mono" : "" },
       k === "command_view" ? commandView(v) : k === "changes" ? fileChangesView(v)
         : typeof v === "string" ? v : JSON.stringify(v)),
  ]);
  const canApprove = acceptOffered(card);
  const delivery = card.delivery === "sent" ? `已发出：${card.decision_sent}`
    : card.delivery === "sending" ? "已认领，可能正在发出（无法撤回）"
    : card.delivery === "failed" ? `送达失败（${card.decision_sent || "无"}）`
    : card.delivery === "blocked" ? "未发送（中断或停止后被拦截）"
    : card.delivery === "not_sent" ? "未发送（请求已结束）" : null;
  return el("div", { class: "card" + (pending ? "" : " done") },
    el("h4", {}, METHOD_LABEL[card.method] || card.method || "工具请求"),
    card.native_agent ? el("div", {class:"note"}, `原生子 Agent · 深度 ${card.native_agent.depth} · ${card.native_agent.agent_type} · ${{reserved:'已预留',running:'运行中',finished:'已结束',unknown:'状态未确认，保留名额'}[card.native_agent.state] || card.native_agent.state}`) : null,
    card.loading ? el("div", { class: "note" }, "读取中…") : el("dl", {}, rows.flat()),
    el("div", { class: "row" },
      chip(label, kind),
      pending && card.expires_at
        ? el("span", { class: "chip", "data-expires": card.expires_at }, `剩余 ${secondsLeft(card.expires_at)} 秒`)
        : null,
      delivery ? chip(delivery, "") : null,
      el("span", { class: "grow" }),
      pending && canApprove ? el("button", { class: "danger", disabled: busy || !card.card_hash,
                               onclick: () => answerCard(card, "approve") }, "允许此操作") : null,
      pending ? el("button", { disabled: busy, onclick: () => answerCard(card, "decline") }, "拒绝此操作") : null),
    // P4.6: decided by the stage's tool rules, not by a click.
    card.auto ? el("div", { class: "note" },
      chip(`按阶段规则自动${card.auto.decision === "approved" ? "允许" : "拒绝"}`,
           card.auto.decision === "approved" ? "ok" : "warn"), " 规则：", card.auto.rule || "") : null,
    pending ? el("div", { class: "note" }, canApprove
      ? "仅允许这一次操作，不记住命令前缀或授权整个会话。允许发出后，实际结果以执行记录为准。"
      : (details.approval_block_reason || "接入方没有提供本次操作的单次允许选项。") +
        " 不经审批、直接在沙箱内运行的操作，Hub 只能观测。") : null);
}

function renderCall(c) {
  const [label, kind] = CALL_LABEL[c.status] || [c.status || "…", ""];
  const busyRun = S.busy.has("run:" + c.id);
  const actions = [];
  const supervised = c.execution_mode === "supervised";
  const awaiting = c.status === "awaiting_approval" && c.approval_status === "pending";
  const consented = S.consent.get(c.id) === true;
  if (awaiting) {
    actions.push(el("button", { class: "primary", disabled: busyRun || (supervised && !consented),
                                title: supervised && !consented ? "先勾选本次调用的监督边界同意" : null,
                                onclick: () => approveAndRun(c) }, "启动本次调用"),
                 el("button", { disabled: busyRun, onclick: () => rejectCall(c) }, "不启动"));
  } else if (c.status === "queued" && c.approval_status === "approved") {
    actions.push(el("button", { class: "primary", disabled: busyRun, onclick: () => runApproved(c) }, "执行"));
  } else if (c.status === "starting" || c.status === "running") {
    actions.push(el("button", { disabled: S.busy.has("interrupt:" + c.id) || !c.turn,
                                title: c.turn ? "请求 provider 中断本轮；以 provider 报告的终态为准" : "模型回合尚未开始",
                                onclick: () => interruptCall(c) }, "中断本轮"),
                 el("button", { class: "danger", disabled: S.busy.has("stop:" + c.id),
                                onclick: () => stopLocal(c) }, "停止本地进程"));
  } else if (c.status === "unknown" && /deadline|timeout|timed.out|restart|local_stop/i.test(c.error || "")) {
    actions.push(el("button", { disabled: S.busy.has("settle:" + c.id), onclick: () => settleEnded(c) }, "登记超时调用已结束"));
  }
  const notes = [];
  if(c.workspace) {
    notes.push(`工作区：${c.workspace} · ${c.workspace_access === 'workspace-write' ? '允许写入' : '只读（不能修改文件）'}`);
    notes.push(c.agent_id === 'codex' ? 'Codex 可在此工作区读取；允许写入时可修改。需要审批的工具仍由本次工具卡或阶段规则决定，原生直接操作不保证逐项拦截。'
      : c.agent_id === 'claude-code' ? (supervised ? '用户监督模式使用文件引用。' : '严格模式中的文件工具需逐次审批；命令、MCP、后台运行和原生续接不开放。') : '此 API 通道没有本机文件工具；只能读取明确附带的文件片段和交接内容。');
  }
  if(c.agent_id === 'claude-code' && !supervised)
    notes.push(c.native_subagents === 'approved' ? '原生子 Agent：每次启动单独审批，并计入全树数量和并发；当前只开放一层前台子任务。' : '原生子 Agent：关闭。');
  if (c.execution_timeout_seconds !== undefined && c.execution_timeout_seconds !== null)
    notes.push(`单次执行时限：${c.execution_timeout_seconds === 0 ? '不限时（可手动停止）' : (c.execution_timeout_seconds / 60) + ' 分钟'}`);
  const handoff = c.handoff || [];
  const parts = (c.context_preview || {}).parts || [];
  const fileCount = parts.filter((x) => x.kind === "file_snippet").length;
  const extras = [handoff.length ? `${handoff.length} 段交接` : "", fileCount ? `${fileCount} 段文件` : "",
                  parts.some((x) => x.kind === "summary_content") ? "阶段摘要" : "",
                  parts.some((x) => x.kind === "history_frame") ? "最近历史" : ""].filter(Boolean);
  if (c.status === "awaiting_approval")
    notes.push(`同意后将调用 ${c.agent_id || "Agent"} 一次，发送` +
               (extras.length ? `下面的完整内容（你的消息 + ${extras.join(" + ")}）` : "本条消息原文") +
               (c.context_mode === "native_resume" ? `，并续接 thread ${short(c.resume_thread_id)} 的上下文。` : "。"));
  if (c.turn) notes.push(c.turn.resumed ? `模型回合已开始（续接 thread ${short(c.turn.thread_id)}）` : "模型回合已开始");
  const endedLocally = ["succeeded", "failed", "canceled", "timed_out"].includes(c.status);
  if (c.ended && c.ended.native_unfinished && c.ended.native_unfinished.length) {
    notes.push(`父回合实际终态：${c.ended.turn_status || "无状态"}；原生子 Agent（thread ` +
               `${c.ended.native_unfinished.map(short).join(", ")}）没有可信的结束证据：` +
               (endedLocally ? "调用已登记结束；" : "调用保持未知，名额保留；") +
               "这些子 Agent 不计入 Hub 配额，Hub 也不能确认它们已停止。");
  } else if (c.ended) {
    notes.push(`provider 报告回合结束：${c.ended.turn_status || "无状态"}` +
               (c.ended.terminal ? "" : endedLocally
                 ? "（接入方终态未确认；调用已登记结束，产物仍需验收）" : "（未确认终态，名额保留）"));
  }
  notes.push(...budgetNotes(c, awaiting || c.status === "queued"));
  if (c.declined.length) notes.push(`已自动拒绝 ${c.declined.length} 个非本回合或无法登记的请求`);
  if (c.stop) notes.push(`已请求停止本地进程：本地进程${c.stop.local_process_exited ? "已退出" : "退出未确认"}；远端停止未确认，${endedLocally ? "调用已登记结束" : "名额保留"}`);
  if (c.interrupt) {
    const i = c.interrupt;
    const settled = ["canceled", "succeeded", "failed", "timed_out"].includes(c.status);
    const k = i.closure || {
      closed_cards: i.closed_cards || 0, blocked_decisions: i.blocked_decisions || 0,
      in_flight: i.in_flight_decisions || 0, already_sent: i.already_sent_decisions || 0 };
    if (!i.pending) {
      const parts = [`作废 ${k.closed_cards} 张待决卡`, `拦截 ${k.blocked_decisions} 个未发送的决定`];
      if (k.in_flight) parts.push(`${k.in_flight} 个决定在关闭前已被认领，可能仍会发出、无法撤回，是否发出以卡片送达状态为准`);
      if (k.already_sent) parts.push(`${k.already_sent} 个决定此前已发出`);
      notes.push("中断生效：本调用的工具审批已关闭，不再认领新的决定（" + parts.join("，") + "）");
    }
    notes.push(i.pending ? "已请求中断，等待服务端答复…"
      : settled ? `已请求中断 → 已收到终态：${(CALL_LABEL[c.status] || [c.status])[0]}`
      : i.interrupt_accepted ? "已请求中断，服务端已接受；尚未收到终态，远端停止未确认，名额保留"
      : i.reason === "not_yet_acknowledged" ? "已请求中断，服务端尚未答复；以回合终态为准，名额保留"
      : `已请求中断，服务端未接受（${i.reason || "原因未知"}）；名额保留`);
  }
  for (const n of c.native) {
    notes.push(`检测到原生子 Agent：${n.tool || n.item_type}${n.status ? "（" + n.status + "）" : ""}` +
               (n.child_thread_ids && n.child_thread_ids.length ? ` → thread ${n.child_thread_ids.map(short).join(", ")}` : "") +
               "。它不在 Hub 的审批与配额内，Hub 只能观测、不能控制。");
  }
  // Supervised: this call's own boundary consent, unticked until the user
  // ticks it, never pre-filled from an earlier call.
  const consentBox = awaiting && supervised ? el("label", { class: "consent" },
    el("input", { type: "checkbox", "aria-label": "同意本次调用的监督边界", checked: consented ? "checked" : null,
                  onchange: (e) => { S.consent.set(c.id, e.target.checked === true); render(); } }),
    " 我已了解并同意本次调用的用户监督边界：" + supervisedBoundaryText(c.agent_id)) : null;
  // A handoff sends more than the user's own text: the exact composed input is
  // what the approval binds, so it is shown in full (open while awaiting).
  // Fold-outs on a call card (T-1d). They default to open while the call can still
  // be approved, but the card is REBUILT on every streamed event - so deriving
  // `open` from the live state alone made the panel snap shut the moment the
  // approval was consumed, losing what the user had opened to read. The user's
  // choice is remembered here instead and wins from then on.
  const fold = (key, title, children) => {
    const remembered = S.foldOpen[key];
    const isOpen = remembered === undefined ? awaiting : remembered;
    return el("details", { class: "sent", open: isOpen ? "open" : null },
      el("summary", {
        // Record intent BEFORE the browser toggles, so the rebuilt card reopens
        // exactly as the user left it.
        onclick: (ev) => { S.foldOpen[key] = !ev.currentTarget.parentNode.open; },
      }, title),
      children);
  };
  const sent = c.sent_text ? fold("inv:" + c.id + ":sent",
    "将发送的完整内容（" + c.sent_text.length + " 字）",
    el("pre", { class: "mono" }, c.sent_text)) : null;
  // What the approval binds, part by part (T-1d).
  const preview = c.context_preview ? fold("inv:" + c.id + ":ctx",
    contextSummary(c.context_preview),
    contextLines(c.context_preview).map((t) => el("div", { class: "note" }, t))) : null;
  return el("div", { class: "call" },
    el("div", { class: "row" },
      chip(label, kind),
      chip(c.agent_id || "Agent", "info"),
      chip(supervised ? "用户监督模式" : "严格模式", supervised ? "warn" : ""),
      c.approval_status ? chip("审批：" + c.approval_status, "") : null,
      c.authorized_by ? chip(`按阶段规则自动批准（${c.authorized_by.step}）`, "ok") : null,
      c.context_mode === "native_resume" ? chip("续接 " + short(c.resume_thread_id), "info") : null,
      c.plan_item ? chip(`子任务 #${c.plan_item.index}（计划 ${c.plan_item.plan_id}，第 ${c.plan_item.attempt} 次）`, "info") : null,
      ...handoff.map((h) => chip(`交接：${h.agent_id} #${h.message_id}（${h.chars} 字）`, "info")),
      // Every settled call shows its usage, with or without a reply (D-T0-3).
      SETTLED.includes(c.status) && usageText(c.usage)
        ? chip("用量 " + usageText(c.usage), c.usage.completeness === "complete" ? "" : "warn") : null,
      el("span", { class: "grow" }), actions),
    el("button", { class: "mini", onclick: () => copyText(c.sent_text ||
      (S.messages.find(m => m.role === "user" && m.invocation && m.invocation.invocation_id === c.id) || {}).text || "") },
      "复制发送内容"),
    consentBox,
    preview,
    sent,
    c.error ? el("div", { class: "note bad", role: "alert" }, "调用失败原因：" + c.error) : null,
    notes.map((n) => el("div", { class: "note" }, n)),
    c.cards.map(renderCard));
}

/* Pre-send context preview (T-1d). Parts are an exact split of the text sent; the
   numbers are estimates (chars_v1, no tokenizer); provider-side context is unknown. */
const PROVIDER_PART = { instructions_and_tools: "基础指令、工具定义、环境信息", thread_history: "thread 历史" };

function contextSummary(p) {
  return `上下文预览：Hub 发送 ${fmtN(p.chars)} 字，约 ${fmtN(p.estimate)} token（估算）；provider 侧未知`;
}

function contextLines(p) {
  const sum = (parts) => parts.reduce((a, x) => ({ chars: a.chars + x.chars, estimate: a.estimate + x.estimate }),
                                      { chars: 0, estimate: 0 });
  const size = (s) => `${fmtN(s.chars)} 字 ≈ ${fmtN(s.estimate)} token`;
  const of = (kind) => p.parts.filter((x) => x.kind === kind);
  const lines = [`你的消息（放在最后）：${size(sum(of("user_input")))}`];
  // The stable lead (summary, files, output hint): what a provider's prompt cache could reuse.
  const STABLE = new Set(["summary_frame", "summary_content", "file_frame", "file_snippet", "output_hint", "separator"]);
  let lead = 0;
  while (lead < p.parts.length && STABLE.has(p.parts[lead].kind)) lead += 1;
  const stable = p.parts.slice(0, lead).filter((x) => x.kind !== "separator");
  if (stable.length) lines.push(`稳定前缀（摘要、文件、输出偏好按固定顺序在前，可供 provider 缓存复用）：${size(sum(stable))}；是否命中以结算后的缓存读为准`);
  const hint = of("output_hint")[0];
  if (hint) lines.push(`输出偏好：${size(hint)}（软目标，不会截断回复）`);
  const summary = of("summary_content")[0];
  if (summary) lines.push(`阶段摘要 v${summary.summary_version}：正文 ${size(summary)}，Hub 框架 ${size(sum(of("summary_frame")))}`);
  const history = of("history_content");
  if (history.length || of("history_frame").length)
    lines.push(`最近历史：${history.length} 条消息，正文 ${size(sum(history))}，Hub 框架 ${size(sum(of("history_frame")))}`);
  const handoffParts = p.parts.filter((x) => x.kind.startsWith("handoff") && x.message_id != null);
  const sources = [...new Set(handoffParts.map((x) => x.message_id))];
  for (const id of sources) {
    const mine = handoffParts.filter((x) => x.message_id === id);
    const agent = mine[0].agent_id || "Agent";
    lines.push(`交接 ${agent} #${id}：正文 ${size(sum(mine.filter((x) => x.kind === "handoff_content")))}，` +
               `Hub 框架 ${size(sum(mine.filter((x) => x.kind === "handoff_frame")))}`);
  }
  const seps = of("separator");
  if (seps.length) lines.push(`分隔空行：${size(sum(seps))}`);
  const files = of("file_snippet");
  if (!files.length) lines.push("文件片段：无");
  for (const f of files) {
    const frame = p.parts.filter((x) => x.kind === "file_frame" && x.path === f.path && x.start_line === f.start_line);
    lines.push(`文件 ${f.path} 第 ${f.start_line}-${f.end_line} 行：正文 ${size(f)}，Hub 框架 ${size(sum(frame))}`);
  }
  lines.push(p.adapter_text && p.adapter_text.chars === 0 ? "适配器附加文本：无（原样发送上面的内容）"
                                                          : "适配器附加文本：未知（该适配器未声明）");
  const h = p.provider_hidden || {};
  const obs = (h.observed || []).map((o) => `${fmtN(o.input_total)}（${o.evidence}，${o.binding}）`);
  lines.push(`provider 侧（${(h.includes || []).map((k) => PROVIDER_PART[k] || k).join("、")}）：未知，不计入估算` +
             (obs.length ? `；同一配置下的历史观测，总输入 ${obs.join("、")} token，含当时很短的输入，不是本次预估` : ""));
  lines.push(`合计：Hub 可见 ${size(p)}；按字符估算（${p.estimator}），不是分词计数`);
  return lines;
}

const SUPERVISED_BOUNDARY = "原生子 Agent 与不经审批的工具操作（可能包括启动其他 Agent 的 CLI）" +
  "不在 Hub 配额内、不能逐项拦截；停止只关闭本次入口进程，后代进程与远端停止不保证。";

/* The summary of the adapter serving this agent (behind a router, its own entry). */
function agentInfo(agent) {
  const a = S.adapter || {};
  return (a.agents && a.agents[agent]) || a;
}

function supervisedBoundaryText(agent) {
  // The agent's adapter's own boundary text when it really admits supervised
  // mode; otherwise (an offline stub, a blocked adapter) the generic boundary.
  const adm = agentInfo(agent).supervised_admission || {};
  return adm.mode === "supervised" && adm.reason ? adm.reason : SUPERVISED_BOUNDARY;
}

function toggleHandoff(m) {
  const i = S.handoff.indexOf(m.message_id);
  if (i >= 0) S.handoff.splice(i, 1);
  else if (S.handoff.length >= 3) { toast("一次最多交接 3 条回复"); return; }
  else S.handoff.push(m.message_id);
  render();
  previewSend();
}

function short(id) { return id ? String(id).slice(0, 8) : "?"; }

const SETTLED = ["succeeded", "failed", "canceled", "timed_out", "unknown"];

/* Why a ledger row is unknown or partial (machine codes from agenthub.usage). */
const USAGE_NOTE = {
  no_usage_reported: "provider 未报告用量", usage_malformed: "用量格式不合规",
  turn_id_reused: "续接复用了回合 ID，无法归属", adapter_reports_no_usage: "适配器不提供用量",
  no_adapter_record: "适配器没有本次调用的记录", adapter_start_raised: "启动时出错",
  not_recorded: "结算时未记录", sum_of_last: "按各次请求相加", resume_baseline_unknown: "续接起点未知",
  last_sum_mismatch: "累计值与逐次请求不一致", total_decreased: "累计值下降",
  late_usage: "用量在回合结束后才到", turn_not_terminal: "回合未正常结束",
  native_children_not_metered: "原生子 Agent 的消耗不在其中", legacy_last: "旧记录只含最后一次请求",
  mapping_unverified: "含含义未验证的字段", mapping_mismatch: "provider 数字自相矛盾",
  cache_fields_missing: "缺少缓存字段", exec_usage_semantics_unverified: "exec 用量口径未验证",
  multi_model_usage_unverified: "多个模型，汇总口径未验证", usage_update_malformed: "部分用量更新不可读",
};
const fmtN = (n) => typeof n === "number" ? n.toLocaleString("en-US") : "?";

/* A normalized ledger row as text. Input totals include cache reads/writes for
   every provider; an unknown is shown as unknown, never as 0. */
function usageText(u) {
  if (!u || typeof u !== "object" || !u.completeness) return "";
  const why = (u.notes || []).filter((n) => USAGE_NOTE[n]).map((n) => USAGE_NOTE[n]);
  if (u.completeness === "unknown") return `未知（${why.join("；") || "原因未知"}）`;
  const cache = [];
  if (u.cache_read) cache.push("缓存读 " + fmtN(u.cache_read));
  if (u.cache_write) cache.push("写 " + fmtN(u.cache_write));
  let text = `输入 ${fmtN(u.input_total)}${cache.length ? "（" + cache.join(" / ") + "）" : ""}` +
             ` / 输出 ${fmtN(u.output_total)}`;
  if (u.input_total && Number.isInteger(u.cache_read)) text += ` · 缓存命中 ${pct(u.cache_read / u.input_total)}`;
  if (u.completeness === "partial") text += `（不完整：${why.join("；") || "原因未知"}）`;
  return text;
}

const pct = (x) => `${(x * 100).toFixed(x < 0.1 ? 1 : 0)}%`;

/* Cache hit rate on its own line: the share of input the provider served from its
   cache (where it was reported), never a saving and never mixed with totals. */
function cacheLine(t) {
  const c = t && t.cache;
  if (!c || c.rate == null) return null;
  return el("div", { class: "usage-line dim" },
    `缓存命中率 ${pct(c.rate)}（${fmtN(c.cache_read)} / ${fmtN(c.input_total)}，按 ${c.calls} 次报告了缓存读的调用；表示 provider 从缓存读入的比例，不是节省量）`);
}

/* A ledger summary: known sums only, and how many calls are partial / unknown. */
function summaryText(t) {
  if (!t || !t.calls) return "暂无已结算的调用";
  const k = t.known, cache = [];
  if (k.cache_read) cache.push("缓存读 " + fmtN(k.cache_read));
  if (k.cache_write) cache.push("写 " + fmtN(k.cache_write));
  const text = `已知 输入 ${fmtN(k.input_total)}${cache.length ? "（" + cache.join(" / ") + "）" : ""}` +
               ` / 输出 ${fmtN(k.output_total)} · ${t.calls} 次调用`;
  const extra = [];
  if (t.partial_calls) extra.push(`${t.partial_calls} 次不完整`);
  if (t.unknown_calls) extra.push(`另有 ${t.unknown_calls} 次未知`);
  const gap = (t.calls_missing.input_total || 0) - t.unknown_calls;
  if (gap > 0) extra.push(`${gap} 次缺少输入数`);
  return extra.length ? `${text}（${extra.join("，")}）` : text;
}

const BUDGET_WARN = {
  unmeterable: "该 Agent 不报告用量", unknown_unbounded: "本任务有用量未知且没有预留的调用",
  unreserved_in_flight: "有预算开启前已获准的调用仍在执行、没有预留（结算后解除）",
  reservation_is_estimate: "未设单次预算，按估算预留", projected_over_budget: "预计会超过总预算",
  warn_threshold: "已达到提醒阈值",
};
const MODE_LABEL = { strict: "严格", soft: "软" };

/* The tree's token budget in one line (latest numbers from the usage view when loaded). */
function budgetLine(b) {
  const parts = [`${MODE_LABEL[b.mode] || b.mode}预算`];
  if (b.total != null) parts.push(`总 ${fmtN(b.total)}`);
  if (b.per_call != null) parts.push(`单次预留 ${fmtN(b.per_call)}`);
  parts.push(`已用（已知）${fmtN(b.known)}`);
  if (b.unsettled) parts.push(`未结算 ${fmtN(b.unsettled)}`);
  if (b.reserved) parts.push(`在途预留 ${fmtN(b.reserved)}`);
  if (b.unbounded) parts.push(`${b.unbounded} 次未知且无预留` +
    (b.unreserved_in_flight ? `（其中 ${b.unreserved_in_flight} 次仍在执行）` : ""));
  if (b.remaining != null) parts.push(`剩余 ${fmtN(b.remaining)}`);
  return parts.join(" · ");
}

/* What the approval card says about budgets: estimate, used, reserved, unknown, and
   the decision this call would get now. The Worker decides again, atomically. */
function budgetNotes(c, pending) {
  const b = c.budget;
  if (!b) return [];
  const notes = [`请求模型：${c.model || "接入方默认（待确认）"}${c.reasoning_effort ? " · 推理强度 " + c.reasoning_effort : ""}`];
  for (const m of c.usage && c.usage.models || []) notes.push(`${m.model_source === "thread_configuration" ? "线程配置回读" : "接入方报告模型"}：${m.model || "未知"}`);
  if (c.model && (c.usage && c.usage.models || []).some(m => m.model && m.model !== c.model))
    notes.push('请求值与报告值不同（可能是别名解析或接入方内部切换）；用量按报告模型保留');
  const tree = (S.usageConv && S.usageConv.budget && S.usageConv.budget.active) ? S.usageConv.budget : b;
  for (const m of b.model_budgets || []) {
    if (m.agent_id !== c.agent_id || !m.active) continue;
    if (!c.model) notes.push('该 Agent 已设置模型预算：先明确选择模型，严格预算不会按未知模型启动');
    if (m.model === c.model) {
      notes.push(`模型预算 ${m.model}：${budgetLine(m)}`);
      if (pending && m.preview && !m.preview.allowed) notes.push(`执行时会被拒绝：${m.preview.message}`);
    }
  }
  if (pending && b.active) {
    notes.push(`预算：${budgetLine({ ...b, ...pick(tree, ["known", "unsettled", "reserved", "unbounded",
                                                          "unreserved_in_flight", "remaining"]) })}`);
    notes.push(`本次估算：Hub 发送部分约 ${fmtN(b.estimate_visible)} token；provider 侧上下文（指令、工具、历史）未知，不含在估算内`);
    const p = b.preview;
    if (p && !p.allowed) notes.push(`按当前预算，执行时会被拒绝：${p.message || p.code}`);
    else if (p) notes.push(`执行时预留 ${fmtN(p.reserve)} token` +
      (p.warnings.length ? `；提示：${p.warnings.map((w) => BUDGET_WARN[w] || w).join("；")}` : ""));
    if (b.mode === "strict" && agentInfo(c.agent_id).usage_reporting === false)
      notes.push("该 Agent 不报告用量：严格预算模式下不会启动");
  } else if (pending && b.estimate_visible != null) {
    notes.push(`本次估算：Hub 发送部分约 ${fmtN(b.estimate_visible)} token（provider 侧上下文未知）；未设整个任务总预算`);
  }
  const t = b.this_call;
  if (t && t.reservation) {
    notes.push(`预算：预留 ${fmtN(t.reservation)}` +
      (t.state === "reserved" ? "（在途）" : `，已知实耗 ${fmtN(t.known)}` +
        (t.unsettled ? `，未结算 ${fmtN(t.unsettled)}` : "")) +
      (t.overrun ? "；超出单次预留（provider 不能中途停在预算上）" : ""));
  } else if (t && t.state === "unreserved") {
    notes.push("预算：此调用在预算开启前已获准、没有预留；结算前计为“用量未知且无预留”");
  } else if (t && t.unbounded) {
    notes.push("预算：此调用没有预留且用量未知");
  }
  return notes;
}

const pick = (o, keys) => Object.fromEntries(keys.filter((k) => o[k] !== undefined).map((k) => [k, o[k]]));

/* Budget form under the conversation usage bar. Saving replaces the tree's policy
   (a new version); unconsumed approvals of this conversation are revoked. */
function budgetForm(b, rootTaskId) {
  const num = (id, value, ph) => el("input", { id, type: "number", min: "1", step: "1", placeholder: ph,
                                               value: value == null ? "" : String(value), style: "width:110px" });
  const mode = el("select", { id: "budgetMode" },
    el("option", { value: "strict", selected: b.mode === "strict" ? "selected" : null }, "严格"),
    el("option", { value: "soft", selected: b.mode === "soft" ? "selected" : null }, "软"));
  return el("div", { class: "usage-line budget-form" },
    "预算：总 ", num("budgetTotal", b.total, "不限"), " 单次 ", num("budgetPerCall", b.per_call, "不限"),
    " 提醒 ", num("budgetWarn", b.warn_percent, "80"), "% ", mode, " ",
    el("button", { class: "mini", disabled: S.busy.has("budget") ? "disabled" : null,
                   title: "保存为新的策略版本；本会话未消费的审批会被撤销，需要重新提交",
                   onclick: () => saveBudget(b.policy, rootTaskId) }, "保存预算"));
}

async function saveBudget(policy, rootTaskId) {
  const val = (id) => { const v = $(id).value.trim(); return v === "" ? null : Number(v); };
  const body = { ...policy, token_budget_total: val("budgetTotal"), token_budget_per_call: val("budgetPerCall"),
                 token_budget_warn_percent: val("budgetWarn") ?? 80, token_budget_mode: $("budgetMode").value };
  // Say why before the server's 422 does (in English); the server still checks.
  const { token_budget_total: total, token_budget_per_call: perCall } = body;
  if ([total, perCall].some((n) => n != null && !(Number.isInteger(n) && n > 0))) {
    toast("预算未保存：总预算和单次预算须为正整数，或留空表示不限"); return;
  }
  if (total != null && perCall != null && perCall > total) {
    toast(`预算未保存：单次预算 ${fmtN(perCall)} 不能大于总预算 ${fmtN(total)}`); return;
  }
  await guarded("budget", async () => {
    const r = await api("PATCH", `/api/tasks/${enc(rootTaskId)}/policy`, body);
    toast(`预算已保存为策略 v${r.version}；撤销了 ${r.revoked_approvals} 个未消费的审批`);
    needUsage();
    needMessages();
  });
}

function agentLines(groups) {
  return Object.entries(groups || {}).map(([agent, t]) =>
    el("div", { class: "usage-line" }, el("span", { class: "chip" }, agent), " ", summaryText(t)));
}

/* Conversation total (with its root task when sub-tasks spent too) and the
   instance panel; both are views over the ledger, never a second booking. */
const MODEL_STATE = {catalogs: {}, selections: {}, loading: new Set()};
try { MODEL_STATE.selections = JSON.parse(localStorage.getItem('agenthub.models') || '{}') || {}; } catch (_) {}
let showGrandTotal = false, usageScope = 'root';
try { showGrandTotal = localStorage.getItem('agenthub.showGrandTotal') === 'true'; } catch (_) {}

function selectionFor(agent = $('agent').value) {
  const value = MODEL_STATE.selections[agent] || {};
  return {model: value.model || null, reasoning_effort: value.reasoning_effort || null};
}
function rememberModel() {
  const before = selectionFor();
  MODEL_STATE.selections[$('agent').value] = {model: $('modelPicker').value.trim() || null,
    reasoning_effort: before.model === ($('modelPicker').value.trim() || null) ? $('modelEffort').value || null : null};
  try { localStorage.setItem('agenthub.models', JSON.stringify(MODEL_STATE.selections)); } catch (_) {}
  renderModelControls(); renderUsage();
}
async function loadModels(refresh = false) {
  const agent = $('agent').value;
  if (!agent || MODEL_STATE.loading.has(agent)) return;
  if (!refresh && MODEL_STATE.catalogs[agent]) { renderModelControls(); return; }
  MODEL_STATE.loading.add(agent);
  try {
    MODEL_STATE.catalogs[agent] = await api(refresh ? 'POST' : 'GET',
      `/api/agents/${enc(agent)}/models${refresh ? '/refresh' : ''}`);
  } catch (e) { if (refresh) toast('读取模型目录失败：' + e.message); }
  finally { MODEL_STATE.loading.delete(agent); renderModelControls(); }
}
function renderModelControls() {
  const agent = $('agent').value, catalog = MODEL_STATE.catalogs[agent] || {};
  const selected = selectionFor(agent);
  $('modelPicker').disabled = catalog.selection === false;
  if (document.activeElement !== $('modelPicker')) $('modelPicker').value = selected.model || '';
  $('modelOptions').replaceChildren(...(catalog.models || []).map(m =>
    el('option', {value:m.id}, m.display_name || m.id)));
  const model = (catalog.models || []).find(m => m.id === selected.model);
  const efforts = model && model.reasoning_efforts || [];
  if (selected.reasoning_effort && !efforts.includes(selected.reasoning_effort)) efforts.push(selected.reasoning_effort);
  $('modelEffort').replaceChildren(el('option', {value:''}, '默认强度'),
    ...efforts.map(e => el('option', {value:e, selected:e === selected.reasoning_effort ? 'selected' : null}, e)));
  $('modelEffort').disabled = catalog.effort_selection === false || !efforts.length;
  $('refreshModelsBtn').hidden = catalog.refresh_available === false;
  $('refreshModelsBtn').disabled = MODEL_STATE.loading.has(agent);
  $('modelHint').textContent = catalog.default_model ? `接入方默认：${catalog.default_model}` : '默认模型未确认';
  $('modelHint').title = [catalog.message, catalog.catalog_note, catalog.fetched_at].filter(Boolean).join('\n');
}
function modelBudgetForm(b, model, rootId) {
  const key = JSON.stringify([model.agent_id, model.provider, model.model]);
  const stored = (b.policy.model_budgets || {})[key] || {};
  const state = (b.model_budgets || []).find(x => x.key === key);
  const input = (name, value, placeholder) => el('input', {name, type:'number', min:'1', step:'1',
    placeholder, value:value ?? '', style:'width:85px'});
  const form = el('div', {class:'budget-form model-budget-form'},
    el('div', {class:'row'}, '总 ', input('total', stored.total, '不限'),
      '单次预留 ', input('per_call', stored.per_call, '不限')),
    el('div', {class:'row'}, '提醒 ', input('warn_percent', stored.warn_percent ?? 80, '80'), '% ',
      el('select', {name:'mode'}, ...['strict','soft'].map(x =>
        el('option', {value:x, selected:x === (stored.mode || 'strict') ? 'selected' : null}, MODE_LABEL[x])))),
    state && state.active ? el('div', {class:'note'}, budgetLine(state)) : null,
    el('button', {class:'mini', onclick: async () => {
      const number = name => {const text = form.querySelector(`[name=${name}]`).value.trim(); return text ? Number(text) : null;};
      const values = {total:number('total'), per_call:number('per_call'), warn_percent:number('warn_percent') ?? 80,
        mode:form.querySelector('[name=mode]').value};
      await guarded('model-budget', async () => {
        const body = {...b.policy, model_budgets:{...(b.policy.model_budgets || {})}};
        if (values.total == null && values.per_call == null) delete body.model_budgets[key];
        else body.model_budgets[key] = values;
        await api('PATCH', `/api/tasks/${enc(rootId)}/policy`, body);
        toast('模型预算已保存；未消费审批按策略变更规则失效'); needUsage(); needMessages();
      });
    }}, '保存模型预算'));
  return el('details', {}, el('summary', {}, state && state.active ? '模型预算 · 剩余 ' + fmtN(state.remaining) : '设置模型预算'), form);
}
function usageModelGroups(data, b, rootId) {
  const rows = [...(data.by_model || [])];
  for (const configured of b.model_budgets || [])
    if (!rows.some(x => x.agent_id === configured.agent_id && x.provider === configured.provider && x.model === configured.model))
      rows.push({...configured, total:{calls:0}});
  const agent = $('agent').value, selected = selectionFor(agent).model;
  const catalog = MODEL_STATE.catalogs[agent];
  if (selected && catalog && !rows.some(x => x.agent_id === agent && x.provider === catalog.provider && x.model === selected))
    rows.push({agent_id:agent, provider:catalog.provider, model:selected, total:{calls:0}});
  const agents = [...new Set([...Object.keys(data.by_agent || {}), ...rows.map(x => x.agent_id)])];
  return agents.map(agentId => el('section', {class:'model-usage-group'},
    el('strong', {}, agentId),
    ...rows.filter(r => r.agent_id === agentId).map(r => el('div', {class:'model-usage-row'},
      el('div', {class:'usage-line', title:'接入来源：' + r.provider + '；模型来源：' +
        ((r.model_source || []).includes('thread_configuration') ? '线程配置回读，推理模型未单独报告' : '接入方用量报告或历史记录')},
        chip(r.model || '模型未归属', r.model ? 'info' : 'warn')),
      el('div', {class:'usage-line'}, summaryText(r.total)),
      r.total.cache && r.total.cache.rate != null ? el('div', {class:'note',
        title:'接入方从缓存读入的输入比例，不是订阅额度节省量'}, '缓存命中 ' + pct(r.total.cache.rate)) : null,
      rootId && r.model ? modelBudgetForm(b, r, rootId) : null)),
    el('div', {class:'usage-line agent-subtotal'}, agentId + ' 合计：' + summaryText((data.by_agent || {})[agentId]))));
}

function render() {
  // A timer, not requestAnimationFrame: rAF is paused while the page is not
  // painted (background tab, covered window), which froze the view while
  // events kept arriving.
  if (S.renderQueued) return;
  S.renderQueued = true;
  setTimeout(function tick() {
    // Replacing nodes between mousedown and mouseup would swallow the click.
    if (S.pointerDown) { setTimeout(tick, 50); return; }
    S.renderQueued = false;
    renderNow();
  }, 16);
}
const scheduleRender = render;

function renderNow() {
  const tl = $("timeline");
  // Remember where the reader is BEFORE the DOM is rebuilt. Nothing below may
  // move the view on its own: a streamed event used to yank it to the bottom
  // whenever the view happened to be within 80px of the end, which is exactly
  // where you sit while reading the newest card.
  const prevTop = tl.scrollTop;
  // Opening (or switching to) a conversation is the one moment a chat is expected
  // to show the newest content. This is a ONE-SHOT jump: once the messages are
  // there, later updates leave the view exactly where the wheel put it.
  const switched = S.cid !== S.renderedCid;
  if (switched) {
    S.renderedCid = S.cid;
    S.jumpPending = true;
  }
  const banner = $("banner");
  banner.hidden = !S.banner;
  banner.replaceChildren(S.banner, " ",
    el("button", { class: "mini", title: "关闭这条通知", onclick: () => { S.banner = ""; render(); } }, "×"));
  // Stage/status polling must not detach unchanged messages or clear a user's
  // selected text. Stream data still accumulates while selection defers this
  // pane; selectionchange applies it as soon as the user clears the selection.
  const signature = JSON.stringify([S.cid, S.messages, [...S.calls], [...S.cards],
                                    S.handoff, [...S.busy], [...S.consent], S.foldOpen, [...S.rawReplies]]);
  const changed = signature !== S.timelineSignature;
  if (changed && (switched || !timelineSelected())) {
  tl.replaceChildren();
  if (!S.cid) {
    tl.append(el("div", { class: "empty" }, "选择或新建一个会话。发送消息只会生成待审批调用，不会直接调用 Agent。"));
  } else if (!S.messages.length) {
    tl.append(el("div", { class: "empty" }, "还没有消息。"));
  }
  const replied = new Set(S.messages.filter((m) => m.role === "assistant").map((m) => m.invocation && m.invocation.invocation_id));
  for (const m of S.messages) {
    if (m.role === "user") {
      const c = m.invocation ? call(m.invocation.invocation_id) : null;
      tl.append(el("div", { class: "msg user" },
        el("div", { class: "who" }, "你", el("span", {}, new Date(m.created_at).toLocaleTimeString())),
        el("div", { class: "bubble" }, m.text),
        c ? renderCall(c) : el("div", { class: "note dim" }, "仅保存的消息（未生成调用）")));
      if (c && (c.stream || c.gap) && !replied.has(c.id)) {
        const live = c.status === "starting" || c.status === "running";
        tl.append(el("div", { class: "msg assistant provisional" },
          el("div", { class: "who" }, c.agent_id || "Agent", chip(live ? "生成中（临时）" : "未形成最终回复", live ? "info" : "warn")),
          el("div", { class: "bubble" + (live ? " cursor" : "") },
             c.stream, c.gap ? "\n[部分增量不可读]" : "")));
      }
    } else {
      const meta = m.result || {};
      const chosen = S.handoff.includes(m.message_id);
      const used = m.invocation ? usageText(call(m.invocation.invocation_id).usage) : "";
      tl.append(el("div", { class: "msg assistant" },
        el("div", { class: "who" }, (m.invocation && m.invocation.agent_id) || "Agent",
           meta.native_session ? chip("thread " + short(meta.native_session.thread_id), "") : null,
           used ? chip("用量 " + used, "") : null,
           el("button", { class: "mini", onclick: () => copyText(m.text), title: "复制这条回复的完整文本" }, "复制回复"),
           el("button", { class: "mini", onclick: () => { S.rawReplies.has(m.message_id) ? S.rawReplies.delete(m.message_id) : S.rawReplies.add(m.message_id); S.timelineSignature = null; render(); } }, S.rawReplies.has(m.message_id) ? "格式化显示" : "查看原文"),
           el("button", { class: "mini" + (chosen ? " on" : ""), "data-handoff": m.message_id,
                          title: "把这条回复附在下一次调用里交给所选 Agent；发送前会在审批卡里完整显示",
                          onclick: () => toggleHandoff(m) }, chosen ? "已选为交接（点此取消）" : "交给其他 Agent"),
           el("button", { class: "mini", title: "把这条回复按“目标/约束/已完成/未解决/下一步/文件”读成摘要草稿，编辑后保存",
                          onclick: () => draftFromReply(m).catch((e) => toast(e.message)) }, "用作摘要草稿"),
           el("button", { class: "mini", title: "把这条回复中“1. agent: 目标 (after 1)”格式的行读成协作计划，编辑后保存",
                          onclick: () => draftPlanFromReply(m).catch((e) => toast(e.message)) }, "读成协作计划")),
        el("div", { class: "bubble" }, S.rawReplies.has(m.message_id) ? m.text : AppDisplay.markdown(m.text))));
    }
  }
  // Two things scroll the view, both user-facing: the call the user just created
  // ("send" was clicked, so take them to the new approval card) and the one-shot
  // jump when a conversation is opened. Everything else keeps the previous offset,
  // so reading is not interrupted - if the wheel was not used, the view does not move.
  const created = S.scrollAfter != null && S.lastMsgId > S.scrollAfter;
  const opening = S.jumpPending && (S.messages || []).length > 0;
  if (created || opening) {
    tl.scrollTop = tl.scrollHeight;
    if (created) S.scrollAfter = null;
    if (opening) S.jumpPending = false;
  } else {
    tl.scrollTop = Math.min(prevTop, Math.max(0, tl.scrollHeight - tl.clientHeight));
  }
  S.timelineSignature = signature;
  S.timelineDirty = false;
  } else if (changed) S.timelineDirty = true;
  exposeStats();
  renderUsage();
  renderSummary();
  renderPlans();
  renderAuto();
  $("sideEmpty").hidden = !["autoBar", "usageConv", "summaryBar", "planBar"].every((id) => $(id).hidden);
  renderComposer();
}

async function archiveConversation(c, archive) {
  await guarded("archive-conversation", async () => {
    if (archive) await api("POST", `/api/conversations/${enc(c.conversation_id)}/archive`);
    else await api("POST", `/api/conversations/${enc(c.conversation_id)}/unarchive`);
    await loadConvs(); render();
    toast(archive ? "已归档：在列表底部“已归档”里可以打开或取消归档" : "已移回会话列表");
  });
}

async function deleteConversation(c) {
  if (!confirm(`删除会话“${c.title || '未命名'}”？将从列表移除，项目文件不删除，用量和审计记录保留。正在运行或状态未知的调用需先处理。`)) return;
  await guarded('delete-conversation', async () => {
    await api('DELETE', `/api/conversations/${enc(c.conversation_id)}`);
    if(S.cid === c.conversation_id) { ++S.viewGen; stopStream(); S.cid = null; resetConversationState(); history.replaceState(null, '', location.pathname); }
    await loadConvs(); render(); toast('会话已删除，项目文件和用量记录保留');
  });
}

async function renameConversation(c) {
  const typed = prompt("会话名称", c.title || "");
  if (typed == null) return;
  const title = typed.trim();
  if (!title) { toast("名称不能为空"); return; }
  await guarded("rename", async () => {
    await api("PATCH", `/api/conversations/${enc(c.conversation_id)}`, { title });
    await loadConvs();
  });
}

function closeDrawers() {
  for (const id of ["leftPanel", "sidePanel"]) $(id).classList.remove("open");
