[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Private console to route Codex / Claude Code and other agents behind user approval with tree-scoped quotas."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
agenthub-api = "agenthub_rt.api:main"
agenthub-worker = "agenthub_kernel.worker:main"

[tool.setuptools.packages.find]
where = ["packages/contracts", "packages/adapters", "apps/worker", "apps/api"]
include = ["agenthub*", "agenthub_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "packages/contracts",
    "packages/adapters",
    "apps/worker",
    "apps/api",
]
addopts = "-q"
